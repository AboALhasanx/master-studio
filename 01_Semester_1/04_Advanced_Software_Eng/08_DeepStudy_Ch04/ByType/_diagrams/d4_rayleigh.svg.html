<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff} #diagram{width:1080px;background:#fff}
text{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif}
</style></head><body><div id="diagram">
<svg width="1080" height="700" viewBox="0 0 1080 700" xmlns="http://www.w3.org/2000/svg">
<text x="540" y="40" text-anchor="middle" font-size="29" font-weight="700" fill="#1e3a8a">The Putnam / Norden-Rayleigh Model</text>
<text x="540" y="68" text-anchor="middle" font-size="15" fill="#64748b">how manpower rises and falls over a project &#8212; and every quantity you can read off it</text>
<line x1="30" y1="92" x2="1050" y2="92" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- the curve plot -->
<rect x="60" y="120" width="560" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<!-- axes -->
<line x1="100" y1="410" x2="600" y2="410" stroke="#475569" stroke-width="2"/>
<line x1="100" y1="410" x2="100" y2="150" stroke="#475569" stroke-width="2"/>
<text x="350" y="446" text-anchor="middle" font-size="12.5" fill="#475569">time (years) &#8594;</text>
<text x="70" y="285" font-size="12.5" fill="#475569" transform="rotate(-90 70 285)">persons</text>
<!-- curve: bell starting at 0, peak at td, decaying -->
<path d="M100 410 C 200 408, 260 330, 330 240 C 390 165, 430 150, 470 175 C 520 215, 550 320, 600 400"
      fill="none" stroke="#2563eb" stroke-width="3"/>
<!-- peak marker -->
<line x1="420" y1="410" x2="420" y2="158" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1.4"/>
<circle cx="420" cy="158" r="5.5" fill="#2563eb"/>
<text x="420" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">peak m&#8320;</text>
<text x="420" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">t = t_d</text>
<!-- area label -->
<text x="250" y="392" font-size="12" fill="#64748b">area under curve = K (total effort)</text>
<!-- start slope -->
<line x1="100" y1="410" x2="155" y2="398" stroke="#dc2626" stroke-width="2.2"/>
<text x="300" y="432" font-size="11" fill="#b91c1c">slope at t=0 = K/t_d&#178; = D (difficulty)</text>
<!-- variants -->
<text x="350" y="470" text-anchor="middle" font-size="11.5" fill="#94a3b8">shape controlled by a = 1/(2t_d&#178;) &#8212; smaller a = flatter, longer</text>

<!-- right: formulas -->
<text x="810" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">THE FORMULAS</text>
<rect x="640" y="140" width="410" height="310" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<g font-size="12.5" fill="#334155">
<text x="660" y="172" font-weight="700" fill="#1e3a8a">manpower rate:</text>
<text x="660" y="196">m(t) = (K/t_d&#178;)&#183;t&#183;e^(&#8722;t&#178;/(2t_d&#178;))</text>
<text x="660" y="226" font-weight="700" fill="#1e3a8a">cumulative effort:</text>
<text x="660" y="250">y(t) = K[1 &#8722; e^(&#8722;t&#178;/(2t_d&#178;))]</text>
<text x="660" y="280" font-weight="700" fill="#1e3a8a">peak manning (t = t_d):</text>
<text x="660" y="304">m&#8320; = K / (t_d &#183; e)      e = 2.71828</text>
<text x="660" y="334" font-weight="700" fill="#1e3a8a">difficulty:</text>
<text x="660" y="358">D = K / t_d&#178;      [person/year]</text>
<text x="660" y="388" font-weight="700" fill="#1e3a8a">manpower build-up:</text>
<text x="660" y="412">D&#8320; = K / t_d&#179;     [person/year&#178;]</text>
</g>

<!-- D0 values -->
<line x1="30" y1="482" x2="1050" y2="482" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="30" y="512" font-size="14" font-weight="700" fill="#1e3a8a">THE BUILD-UP CONSTANT D&#8320; (memorise the three values)</text>
<rect x="30" y="526" width="320" height="76" rx="9" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
<text x="190" y="556" text-anchor="middle" font-size="20" font-weight="700" fill="#15803d">D&#8320; = 8</text>
<text x="190" y="582" text-anchor="middle" font-size="12" fill="#334155">new software, many interfaces</text>
<rect x="380" y="526" width="320" height="76" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
<text x="540" y="556" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">D&#8320; = 15</text>
<text x="540" y="582" text-anchor="middle" font-size="12" fill="#334155">new, standalone system</text>
<rect x="730" y="526" width="320" height="76" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
<text x="890" y="556" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">D&#8320; = 27</text>
<text x="890" y="582" text-anchor="middle" font-size="12" fill="#334155">rebuild from existing software</text>

<!-- trade-off -->
<line x1="30" y1="622" x2="1050" y2="622" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="540" y="656" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">SIZE &#8212; TIME RELATION:   S = C &#183; K^(1/3) &#183; t_d^(4/3)      (technology factor C: 610 &#8230; 57314)</text>
<text x="540" y="678" text-anchor="middle" font-size="12" fill="#94a3b8">cut t_d &#8594; K and m&#8320; leap upward (Example 4.18) &#8212; the time/cost trade-off</text>
</svg>
</div></body></html>
