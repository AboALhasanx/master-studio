<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff} #diagram{width:1080px;background:#fff}
text{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif}
</style></head><body><div id="diagram">
<svg width="1080" height="700" viewBox="0 0 1080 700" xmlns="http://www.w3.org/2000/svg">
<text x="540" y="40" text-anchor="middle" font-size="29" font-weight="700" fill="#1e3a8a">The Calculation Toolbox &#8212; Every Formula, One Sheet</text>
<text x="540" y="68" text-anchor="middle" font-size="15" fill="#64748b">the master reference for T7 &#8212; memorise the boxes, then practise the templates</text>
<line x1="30" y1="92" x2="1050" y2="92" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- FP -->
<rect x="30" y="110" width="330" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="48" y="138" font-size="14" font-weight="700" fill="#1e3a8a">FUNCTION POINTS</text>
<text x="48" y="164" font-size="12.5" fill="#334155">UFP = &#931; (count &#215; weight)</text>
<text x="48" y="186" font-size="12.5" fill="#334155">CAF = 0.65 + 0.01&#931;Fi</text>
<text x="48" y="208" font-size="13" font-weight="700" fill="#1e40af">FP = UFP &#215; CAF</text>
<text x="48" y="234" font-size="11" fill="#64748b">weights: EI 3/4/6 &#183; EO 4/5/7 &#183; EQ 3/4/6</text>
<text x="48" y="250" font-size="11" fill="#64748b">ILF 7/10/15 &#183; EIF 5/7/10</text>

<!-- Empirical -->
<rect x="375" y="110" width="330" height="150" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="393" y="138" font-size="14" font-weight="700" fill="#6d28d9">EMPIRICAL MODELS</text>
<text x="393" y="164" font-size="12" fill="#334155">W-F:  E = 5.2 L^0.91</text>
<text x="393" y="184" font-size="12" fill="#334155">         D = 4.1 L^0.36</text>
<text x="393" y="208" font-size="12" fill="#334155">SEL:  E = 1.4 L^0.93</text>
<text x="393" y="228" font-size="12" fill="#334155">         D = 4.6 L^0.26</text>
<text x="393" y="248" font-size="11" fill="#64748b">L in KLOC; invert for L</text>

<!-- COCOMO basic -->
<rect x="720" y="110" width="330" height="150" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="738" y="138" font-size="14" font-weight="700" fill="#92400e">COCOMO 81</text>
<text x="738" y="164" font-size="12" fill="#334155">E = a (KLOC)^b</text>
<text x="738" y="184" font-size="12" fill="#334155">D = c (E)^d</text>
<text x="738" y="206" font-size="12" fill="#334155">Intermediate: &#215; EAF</text>
<text x="738" y="228" font-size="11" fill="#64748b">SS = E/D &#183; P = KLOC/E</text>
<text x="738" y="248" font-size="11" fill="#64748b">a,b,c,d from mode table</text>

<!-- COCOMO II -->
<rect x="30" y="276" width="330" height="150" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
<text x="48" y="304" font-size="14" font-weight="700" fill="#0e7490">COCOMO II</text>
<text x="48" y="330" font-size="12" fill="#334155">B = 0.91 + 0.01&#931;SF</text>
<text x="48" y="350" font-size="12" fill="#334155">PM_nom = 2.5 &#215; size^B</text>
<text x="48" y="370" font-size="12" fill="#334155">PM_adj = PM_nom &#215; &#928;(EM)</text>
<text x="48" y="392" font-size="11" fill="#64748b">7 EM (early) / 17 EM (post)</text>
<text x="48" y="410" font-size="11" fill="#64748b">App Comp: Effort = NOP/PROD</text>

<!-- Putnam -->
<rect x="375" y="276" width="330" height="150" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
<text x="393" y="304" font-size="14" font-weight="700" fill="#115e59">PUTNAM / RAYLEIGH</text>
<text x="393" y="330" font-size="12" fill="#334155">m&#8320; = K/(t_d&#183;e)</text>
<text x="393" y="350" font-size="12" fill="#334155">D = K/t_d&#178;  &#183;  D&#8320; = K/t_d&#179;</text>
<text x="393" y="370" font-size="12" fill="#334155">K_d = K/6  &#183;  t_od = t_d/&#8730;6</text>
<text x="393" y="392" font-size="12" font-weight="700" fill="#0f766e">S = C&#183;K^(1/3)&#183;t_d^(4/3)</text>
<text x="393" y="412" font-size="11" fill="#64748b">y(t) = K[1 &#8722; e^(&#8722;t&#178;/2t_d&#178;)]</text>

<!-- Derived / misc -->
<rect x="720" y="276" width="330" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="738" y="304" font-size="14" font-weight="700" fill="#334155">DERIVED &amp; CONSTANTS</text>
<text x="738" y="330" font-size="12" fill="#334155">SS = E/D (avg staff)</text>
<text x="738" y="350" font-size="12" fill="#334155">P = KLOC/E (productivity)</text>
<text x="738" y="370" font-size="12" fill="#334155">P &#8733; D^(&#8722;2/3)</text>
<text x="738" y="390" font-size="12" fill="#334155">e = 2.71828 &#183; &#966; = 3.67</text>
<text x="738" y="410" font-size="11" fill="#64748b">C range 610&#8230;57314</text>

<!-- bottom rows -->
<line x1="30" y1="446" x2="1050" y2="446" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="540" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">UNITS &#8212; the #1 source of lost marks</text>
<rect x="120" y="492" width="200" height="52" rx="8" fill="#fef2f2" stroke="#ef4444"/>
<text x="220" y="516" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">PY &#8596; PM</text>
<text x="220" y="534" text-anchor="middle" font-size="11" fill="#64748b">1 PY = 12 PM</text>
<rect x="340" y="492" width="200" height="52" rx="8" fill="#fef2f2" stroke="#ef4444"/>
<text x="440" y="516" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">LOC &#8596; KLOC</text>
<text x="440" y="534" text-anchor="middle" font-size="11" fill="#64748b">1 KLOC = 1000 LOC</text>
<rect x="560" y="492" width="200" height="52" rx="8" fill="#fef2f2" stroke="#ef4444"/>
<text x="660" y="516" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">years &#8596; months</text>
<text x="660" y="534" text-anchor="middle" font-size="11" fill="#64748b">1 yr = 12 mo</text>
<rect x="780" y="492" width="200" height="52" rx="8" fill="#fef2f2" stroke="#ef4444"/>
<text x="880" y="516" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">K vs K_d</text>
<text x="880" y="534" text-anchor="middle" font-size="11" fill="#64748b">full vs dev sub-cycle</text>

<text x="540" y="586" text-anchor="middle" font-size="13" fill="#475569">Worked examples to drill: 4.1, 4.3 (FP) &#183; 4.4 (empirical) &#183; 4.5, 4.7 (basic) &#183; 4.10, 4.11 (COCOMO II)</text>
<text x="540" y="614" text-anchor="middle" font-size="13" fill="#475569">&#183; 4.12&#8211;4.18 (Putnam) &#183; plus Exercises 4.5, 4.10, 4.13, 4.14, 4.16, 4.20, 4.21, 4.25, 4.29</text>
</svg>
