<svg width="1080" height="700" viewBox="0 0 1080 700" xmlns="http://www.w3.org/2000/svg">
<text x="540" y="40" text-anchor="middle" font-size="29" font-weight="700" fill="#1e3a8a">Risk Management &#8212; Two Classifications, Don't Mix Them</text>
<text x="540" y="68" text-anchor="middle" font-size="15" fill="#64748b">Jones' 5 risk CATEGORIES vs the 2 ACTIVITY groups (the classic exam trap)</text>
<line x1="30" y1="92" x2="1050" y2="92" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- LEFT: activities (2 groups) -->
<text x="270" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">ACTIVITIES &#8212; 2 groups (Fig 9)</text>
<rect x="40" y="142" width="460" height="250" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
<rect x="60" y="162" width="420" height="100" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
<text x="80" y="188" font-size="14" font-weight="700" fill="#1e40af">RISK ASSESSMENT</text>
<text x="80" y="212" font-size="12.5" fill="#334155">&#8226; Risk Identification</text>
<text x="80" y="234" font-size="12.5" fill="#334155">&#8226; Risk Analysis</text>
<text x="80" y="256" font-size="12.5" fill="#334155">&#8226; Risk Prioritization</text>
<rect x="60" y="274" width="420" height="100" rx="8" fill="#bbf7d0" stroke="#4ade80"/>
<text x="80" y="300" font-size="14" font-weight="700" fill="#14532d">RISK CONTROL</text>
<text x="80" y="324" font-size="12.5" fill="#334155">&#8226; Risk Management Planning</text>
<text x="80" y="346" font-size="12.5" fill="#334155">&#8226; Risk Monitoring</text>
<text x="80" y="368" font-size="12.5" fill="#334155">&#8226; Risk Resolution</text>
<text x="270" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Answer to MCQ 4.24 = 2 categories (not 5!)</text>

<!-- divisor -->
<line x1="530" y1="120" x2="530" y2="470" stroke="#e2e8f0" stroke-width="1.4"/>

<!-- RIGHT: Jones categories (5) -->
<text x="800" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">JONES' 5 RISK CATEGORIES</text>
<rect x="560" y="142" width="480" height="250" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="580" y="174" font-size="13" fill="#334155"><tspan font-weight="700" fill="#92400e">1. Dependencies</tspan> &#8212; outside agencies, trained staff, inter-group, subcontractors</text>
<text x="580" y="216" font-size="13" fill="#334155"><tspan font-weight="700" fill="#92400e">2. Requirements issues</tspan> &#8212; uncertain / changing / unprioritised requirements</text>
<text x="580" y="258" font-size="13" fill="#334155"><tspan font-weight="700" fill="#92400e">3. Management issues</tspan> &#8212; inadequate planning, unclear ownership, poor communication</text>
<text x="580" y="300" font-size="13" fill="#334155"><tspan font-weight="700" fill="#92400e">4. Lack of knowledge</tspan> &#8212; training, domain experience, new technology</text>
<text x="580" y="342" font-size="13" fill="#334155"><tspan font-weight="700" fill="#92400e">5. Other</tspan> &#8212; testing facilities, staff turnover, unachievable performance</text>
<text x="800" y="382" text-anchor="middle" font-size="12" fill="#64748b">(slide 184&#8211;189 — the risk TYPES, not the process)</text>

<!-- bottom: exposure + bridge -->
<line x1="30" y1="460" x2="1050" y2="460" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="40" y="480" width="480" height="110" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
<text x="60" y="512" font-size="15" font-weight="700" fill="#b91c1c">RISK EXPOSURE</text>
<text x="60" y="542" font-size="15" fill="#334155">RE = probability(loss) &#215; magnitude(loss)</text>
<text x="60" y="570" font-size="12" fill="#64748b">higher RE = higher priority &#8594; this is how you prioritise</text>

<rect x="560" y="480" width="480" height="110" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/>
<text x="580" y="512" font-size="15" font-weight="700" fill="#115e59">BRIDGE to Pressman (RMMM)</text>
<text x="580" y="540" font-size="12.5" fill="#334155">Aggarwal: Assessment + Control</text>
<text x="580" y="562" font-size="12.5" fill="#334155">&#8776; Pressman: RMMM = Mitigation + Monitoring + Management</text>
<text x="580" y="584" font-size="11" fill="#64748b">(external papers use RMMM &#8212; same idea, different labels)</text>

<text x="540" y="632" text-anchor="middle" font-size="13" fill="#475569">Risk = <tspan font-style="italic">"a problem that may cause some loss or threaten the success of the project, but which has not happened yet"</tspan></text>
<text x="540" y="662" text-anchor="middle" font-size="12" fill="#94a3b8">Capers Jones identified the top five risk factors across applications (slide 184)</text>
