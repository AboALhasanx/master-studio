<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff} #diagram{width:1080px;background:#fff}
text{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif}
</style></head><body><div id="diagram">
<svg width="1080" height="640" viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg">
<text x="540" y="42" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">Three Strategies of Design</text>
<text x="540" y="72" text-anchor="middle" font-size="16" fill="#64748b">bottom-up &#183; top-down &#183; hybrid (the most practical) &#183; slides 32&#8211;35</text>
<line x1="30" y1="96" x2="1050" y2="96" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- Panel A top-down -->
<rect x="30" y="116" width="330" height="480" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="195" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#1e40af">Top-Down</text>
<text x="195" y="176" text-anchor="middle" font-size="12.5" fill="#64748b">start from the whole</text>
<rect x="120" y="200" width="150" height="46" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.4"/>
<text x="195" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Main system</text>
<line x1="195" y1="246" x2="195" y2="270" stroke="#93c5fd" stroke-width="1.6"/>
<line x1="110" y1="270" x2="280" y2="270" stroke="#93c5fd" stroke-width="1.6"/>
<line x1="110" y1="270" x2="110" y2="292" stroke="#93c5fd" stroke-width="1.6"/>
<line x1="280" y1="270" x2="280" y2="292" stroke="#93c5fd" stroke-width="1.6"/>
<rect x="55" y="292" width="110" height="42" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
<text x="110" y="318" text-anchor="middle" font-size="12" fill="#1e3a8a">Module A</text>
<rect x="225" y="292" width="110" height="42" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
<text x="280" y="318" text-anchor="middle" font-size="12" fill="#1e3a8a">Module B</text>
<text x="195" y="366" text-anchor="middle" font-size="11.5" fill="#64748b">&#8595; decompose again &#8595;</text>
<rect x="55" y="382" width="110" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="110" y="408" text-anchor="middle" font-size="12" fill="#1e3a8a">Sub A1</text>
<rect x="225" y="382" width="110" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="280" y="408" text-anchor="middle" font-size="12" fill="#1e3a8a">Sub B1</text>
<text x="60" y="460" font-size="12.5" fill="#166534">&#10003; Clear overall structure early</text>
<text x="60" y="484" font-size="12.5" fill="#166534">&#10003; Good for novel problems</text>
<text x="60" y="514" font-size="12.5" fill="#b91c1c">&#10007; Cannot reuse library modules</text>
<text x="60" y="538" font-size="12.5" fill="#b91c1c">&#10007; Low-level detail decided late</text>

<!-- Panel B bottom-up -->
<rect x="375" y="116" width="330" height="480" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
<text x="540" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#15803d">Bottom-Up</text>
<text x="540" y="176" text-anchor="middle" font-size="12.5" fill="#64748b">start from the parts</text>
<rect x="465" y="200" width="150" height="42" rx="8" fill="#bbf7d0" stroke="#4ade80" stroke-width="1.3"/>
<text x="540" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Library module 1</text>
<rect x="465" y="252" width="150" height="42" rx="8" fill="#bbf7d0" stroke="#4ade80" stroke-width="1.3"/>
<text x="540" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Library module 2</text>
<line x1="540" y1="294" x2="540" y2="318" stroke="#86efac" stroke-width="1.6"/>
<path d="M540 326 l-6 -11 l12 0 z" fill="#4ade80"/>
<rect x="465" y="330" width="150" height="42" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.3"/>
<text x="540" y="356" text-anchor="middle" font-size="12" fill="#14532d">Combine &#8594; level 2</text>
<line x1="540" y1="372" x2="540" y2="396" stroke="#86efac" stroke-width="1.6"/>
<path d="M540 404 l-6 -11 l12 0 z" fill="#4ade80"/>
<rect x="455" y="408" width="170" height="46" rx="8" fill="#86efac" stroke="#22c55e" stroke-width="1.4"/>
<text x="540" y="437" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Whole system</text>
<text x="405" y="492" font-size="12.5" fill="#166534">&#10003; Maximises library reuse</text>
<text x="405" y="516" font-size="12.5" fill="#166534">&#10003; Suits bottom-up testing</text>
<text x="405" y="546" font-size="12.5" fill="#b91c1c">&#10007; Risk building unneeded parts</text>
<text x="405" y="570" font-size="12.5" fill="#b91c1c">&#10007; Overall architecture is late</text>

<!-- Panel C hybrid -->
<rect x="720" y="116" width="330" height="480" rx="12" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2.2"/>
<text x="885" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#6d28d9">Hybrid &#9733;</text>
<text x="885" y="174" text-anchor="middle" font-size="12.5" fill="#64748b">the most practical</text>
<rect x="800" y="196" width="170" height="46" rx="8" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="885" y="225" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">Architecture top-down</text>
<line x1="885" y1="242" x2="885" y2="272" stroke="#c4b5fd" stroke-width="1.6"/>
<line x1="815" y1="272" x2="955" y2="272" stroke="#c4b5fd" stroke-width="1.6"/>
<line x1="815" y1="272" x2="815" y2="300" stroke="#c4b5fd" stroke-width="1.6"/>
<line x1="955" y1="272" x2="955" y2="300" stroke="#c4b5fd" stroke-width="1.6"/>
<rect x="760" y="300" width="110" height="40" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.2"/>
<text x="815" y="325" text-anchor="middle" font-size="11.5" fill="#5b21b6">Module A</text>
<rect x="900" y="300" width="110" height="40" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.2"/>
<text x="955" y="325" text-anchor="middle" font-size="11.5" fill="#5b21b6">Module B</text>
<text x="885" y="368" text-anchor="middle" font-size="11.5" fill="#7c3aed">&#8593; bottom-up near the leaves &#8593;</text>
<rect x="760" y="384" width="110" height="40" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
<text x="815" y="409" text-anchor="middle" font-size="11.5" fill="#5b21b6">reuse lib</text>
<rect x="900" y="384" width="110" height="40" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
<text x="955" y="409" text-anchor="middle" font-size="11.5" fill="#5b21b6">reuse lib</text>
<text x="750" y="462" font-size="12.5" fill="#6d28d9">&#10003; Structure early (top-down)</text>
<text x="750" y="486" font-size="12.5" fill="#6d28d9">&#10003; Reuse + testing at the bottom</text>
<text x="750" y="510" font-size="12.5" fill="#6d28d9">&#10003; Matches how real projects work</text>
<text x="750" y="542" font-size="12.5" fill="#475569">This is why it is called &#8220;most practical.&#8221;</text>
<text x="750" y="566" font-size="12.5" fill="#475569">Most modules live near the bottom, where</text>
<text x="750" y="586" font-size="12.5" fill="#475569">intuition is simpler and libraries are reusable.</text>
</svg>
</div></body></html>
