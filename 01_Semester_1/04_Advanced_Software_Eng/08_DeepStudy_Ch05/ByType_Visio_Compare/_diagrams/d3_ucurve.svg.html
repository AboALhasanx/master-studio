<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff} #diagram{width:1080px;background:#fff}
text{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif}
</style></head><body><div id="diagram">
<svg width="1080" height="620" viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg">
<text x="540" y="42" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">Modularity and Software Cost</text>
<text x="540" y="72" text-anchor="middle" font-size="16" fill="#64748b">Fig. 4 (slide 14) &#183; there is an optimum number of modules — not &#8220;as many as possible&#8221;</text>
<line x1="30" y1="96" x2="1050" y2="96" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- axes -->
<line x1="130" y1="500" x2="980" y2="500" stroke="#334155" stroke-width="2.5"/>
<line x1="130" y1="140" x2="130" y2="500" stroke="#334155" stroke-width="2.5"/>
<text x="560" y="548" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Number of Modules &#8594;</text>
<text x="60" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#334155" transform="rotate(-90 60 320)">Cost of Effort &#8594;</text>

<!-- Cost to integrate: rises -->
<path d="M130 470 C 300 440, 500 400, 980 175" fill="none" stroke="#ef4444" stroke-width="3.2"/>
<text x="870" y="200" font-size="13.5" font-weight="700" fill="#b91c1c">Cost to integrate</text>

<!-- Total software cost U -->
<path d="M130 300 C 260 175, 360 205, 470 232 C 640 272, 800 330, 980 420" fill="none" stroke="#1e40af" stroke-width="4"/>
<text x="170" y="290" font-size="13.5" font-weight="700" fill="#1e40af">Total software cost</text>

<!-- minimum region -->
<line x1="430" y1="140" x2="430" y2="500" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5"/>
<line x1="560" y1="140" x2="560" y2="500" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5"/>
<rect x="430" y="140" width="130" height="360" fill="#dcfce7" opacity="0.55"/>
<circle cx="470" cy="232" r="8" fill="#15803d"/>
<text x="462" y="222" font-size="16" font-weight="700" fill="#15803d">M</text>
<text x="495" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">Region of Minimum Cost</text>

<!-- annotation left -->
<rect x="150" y="380" width="250" height="96" rx="9" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4"/>
<text x="166" y="406" font-size="13.5" font-weight="700" fill="#c2410c">Too FEW modules</text>
<text x="166" y="428" font-size="12" fill="#7c2d12">Each module is huge and does too much;</text>
<text x="166" y="446" font-size="12" fill="#7c2d12">cost to integrate and understand climbs.</text>
<text x="166" y="466" font-size="11.5" fill="#9a3412">= low cohesion, monolithic</text>

<!-- annotation right -->
<rect x="700" y="360" width="270" height="110" rx="9" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4"/>
<text x="716" y="386" font-size="13.5" font-weight="700" fill="#c2410c">Too MANY modules</text>
<text x="716" y="408" font-size="12" fill="#7c2d12">Each module is tiny; the cost of gluing them</text>
<text x="716" y="426" font-size="12" fill="#7c2d12">together (integration) outgrows the benefit.</text>
<text x="716" y="446" font-size="11.5" fill="#9a3412">= coordination overhead, high coupling</text>

<rect x="130" y="490" width="850" height="0" fill="none"/>

<!-- takeaway -->
<rect x="150" y="566" width="840" height="44" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="170" y="594" font-size="14" fill="#1e40af"><tspan font-weight="700">Takeaway:</tspan> stop at point M — the design that minimises total cost, not the design with the most (or fewest) modules.</text>
</svg>
</div></body></html>
