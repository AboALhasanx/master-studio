<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff} #diagram{width:1080px;background:#fff}
text{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif}
</style></head><body><div id="diagram">
<svg width="1080" height="660" viewBox="0 0 1080 660" xmlns="http://www.w3.org/2000/svg">
<text x="540" y="42" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">Object-Oriented Design Notation</text>
<text x="540" y="72" text-anchor="middle" font-size="16" fill="#64748b">class diagram &#183; the four relationships &#183; object types &#183; slides 63&#8211;78</text>
<line x1="30" y1="96" x2="1050" y2="96" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- Class box anatomy -->
<text x="30" y="130" font-size="15" font-weight="700" fill="#1e3a8a" letter-spacing="1">ANATOMY OF A CLASS</text>
<rect x="30" y="144" width="280" height="150" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<line x1="30" y1="184" x2="310" y2="184" stroke="#334155" stroke-width="2"/>
<line x1="30" y1="238" x2="310" y2="238" stroke="#334155" stroke-width="2"/>
<text x="170" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Shape</text>
<text x="44" y="206" font-size="12" fill="#334155">&#8722; x, y : int</text>
<text x="44" y="226" font-size="12" fill="#334155">&#8722; color : Colour</text>
<text x="44" y="260" font-size="12" fill="#334155">+ draw()</text>
<text x="44" y="280" font-size="12" fill="#334155">+ move(dx, dy)</text>
<text x="44" y="322" font-size="11.5" fill="#64748b">top = name &#183; middle = attributes (state)</text>
<text x="44" y="340" font-size="11.5" fill="#64748b">bottom = operations (behaviour)</text>

<!-- Four relationships -->
<text x="350" y="130" font-size="15" font-weight="700" fill="#1e3a8a" letter-spacing="1">THE FOUR RELATIONSHIPS (slide 77&#8211;78)</text>

<rect x="350" y="146" width="330" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
<line x1="366" y1="184" x2="446" y2="184" stroke="#1e3a8a" stroke-width="2.4"/>
<text x="455" y="180" font-size="13.5" font-weight="700" fill="#1e40af">Association</text>
<text x="455" y="202" font-size="11.5" fill="#334155">a structural link (&#8220;has&#8211;a&#8221;, semantic)</text>

<rect x="350" y="230" width="330" height="76" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4"/>
<line x1="366" y1="268" x2="436" y2="268" stroke="#6d28d9" stroke-width="2.4" stroke-dasharray="7 5"/>
<path d="M446 268 l-13 -6 l0 12 z" fill="#6d28d9"/>
<text x="455" y="264" font-size="13.5" font-weight="700" fill="#6d28d9">Dependency</text>
<text x="455" y="286" font-size="11.5" fill="#334155">one module needs the other (&#8220;uses&#8221;)</text>

<rect x="350" y="314" width="330" height="76" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
<rect x="366" y="344" width="19" height="15" fill="none" stroke="#15803d" stroke-width="2"/>
<line x1="386" y1="352" x2="446" y2="352" stroke="#15803d" stroke-width="2.4"/>
<text x="455" y="348" font-size="13.5" font-weight="700" fill="#15803d">Aggregation</text>
<text x="455" y="370" font-size="11.5" fill="#334155">whole&#8211;part (&#8220;part&#8211;of&#8221;, hollow diamond)</text>

<rect x="350" y="398" width="330" height="76" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.4"/>
<path d="M366 436 l20 -14 l-20 -14 l-20 14 z" fill="none" stroke="#a16207" stroke-width="2"/>
<line x1="386" y1="436" x2="446" y2="436" stroke="#a16207" stroke-width="2.4"/>
<text x="455" y="432" font-size="13.5" font-weight="700" fill="#a16207">Generalisation</text>
<text x="455" y="454" font-size="11.5" fill="#334155">inheritance (&#8220;is&#8211;a&#8221;, hollow triangle)</text>

<!-- Object types -->
<text x="715" y="130" font-size="15" font-weight="700" fill="#1e3a8a" letter-spacing="1">THREE OBJECT TYPES (slide 75)</text>
<rect x="715" y="146" width="335" height="76" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.4"/>
<text x="733" y="174" font-size="13.5" font-weight="700" fill="#0e7490">Boundary / interface</text>
<text x="733" y="198" font-size="11.5" fill="#334155">what the actor sees &#183; the UI / API edge</text>

<rect x="715" y="230" width="335" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
<text x="733" y="258" font-size="13.5" font-weight="700" fill="#1e40af">Entity</text>
<text x="733" y="282" font-size="11.5" fill="#334155">persistent domain things (Book, Student)</text>

<rect x="715" y="314" width="335" height="76" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.4"/>
<text x="733" y="342" font-size="13.5" font-weight="700" fill="#a16207">Control</text>
<text x="733" y="366" font-size="11.5" fill="#334155">coordinates a use case (the &#8220;doer&#8221;)</text>

<rect x="715" y="398" width="335" height="76" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.4"/>
<text x="733" y="426" font-size="13.5" font-weight="700" fill="#6d28d9">Inheritance &#8594; Polymorphism</text>
<text x="733" y="450" font-size="11.5" fill="#334155">a subclass &#8220;is-a&#8221; superclass; one message,</text>
<text x="733" y="468" font-size="11.5" fill="#334155">many implementations (override)</text>

<!-- Object/class/ADT note -->
<line x1="30" y1="500" x2="1050" y2="500" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="30" y="530" font-size="14" font-weight="700" fill="#1e3a8a">Object vs Class vs ADT</text>
<text x="30" y="556" font-size="12.5" fill="#334155"><tspan font-weight="700">Object</tspan> = an instance with state + behaviour + identity.   <tspan font-weight="700">Class</tspan> = the template from which objects are created.</text>
<text x="30" y="580" font-size="12.5" fill="#334155"><tspan font-weight="700">ADT</tspan> = data + the operations on it, with the implementation hidden. A class extends the ADT by adding inheritance and polymorphism.</text>
<rect x="30" y="598" width="1020" height="46" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
<text x="48" y="626" font-size="12.5" fill="#166534">Encapsulation hides the state behind the operations &#8212; the same principle that turns &#8220;content coupling&#8221; into an encapsulation violation.</text>
</svg>
</div></body></html>
