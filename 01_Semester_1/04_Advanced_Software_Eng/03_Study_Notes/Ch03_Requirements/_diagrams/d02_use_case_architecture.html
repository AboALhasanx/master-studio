<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #diagram { width: 1080px; padding: 20px; box-sizing: border-box; background: #fff; }
  text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; fill: #111827; }
</style>
</head>
<body>
<div id="diagram">
<svg width="1040" height="700" viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UML use-case diagram for an ATM banking system">
  <defs>
    <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#111827" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- System boundary -->
  <rect x="205" y="48" width="660" height="600" fill="#fff" stroke="#111827" stroke-width="2"/>
  <rect x="205" y="35" width="215" height="28" fill="#fff"/>
  <text x="216" y="55" font-size="19" font-weight="700">ATM Banking System</text>

  <!-- Actors: stick-figure notation; actors stay outside the system boundary -->
  <g stroke="#111827" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="90" cy="250" r="17"/>
    <line x1="90" y1="267" x2="90" y2="326"/>
    <line x1="60" y1="287" x2="120" y2="287"/>
    <line x1="90" y1="326" x2="66" y2="372"/>
    <line x1="90" y1="326" x2="114" y2="372"/>
  </g>
  <text x="90" y="398" text-anchor="middle" font-size="18">Customer</text>

  <g stroke="#111827" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="970" cy="310" r="17"/>
    <line x1="970" y1="327" x2="970" y2="386"/>
    <line x1="940" y1="347" x2="1000" y2="347"/>
    <line x1="970" y1="386" x2="946" y2="432"/>
    <line x1="970" y1="386" x2="994" y2="432"/>
  </g>
  <text x="970" y="454" text-anchor="middle" font-size="16">Bank Consortium</text>
  <text x="970" y="476" text-anchor="middle" font-size="16">Server</text>

  <!-- Use cases -->
  <ellipse cx="380" cy="180" rx="135" ry="54" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="380" y="151" text-anchor="middle" font-size="19" font-weight="600">Withdraw Cash</text>
  <line x1="270" y1="169" x2="490" y2="169" stroke="#111827" stroke-width="1"/>
  <text x="380" y="189" text-anchor="middle" font-size="14" font-style="italic">extension points</text>
  <text x="380" y="210" text-anchor="middle" font-size="15">balanceChecked</text>

  <ellipse cx="720" cy="220" rx="135" ry="45" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="720" y="226" text-anchor="middle" font-size="17" font-weight="600">Dispense Overdraft Warning</text>

  <ellipse cx="380" cy="500" rx="135" ry="45" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="380" y="506" text-anchor="middle" font-size="19" font-weight="600">Transfer Funds</text>

  <ellipse cx="720" cy="350" rx="135" ry="45" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="720" y="356" text-anchor="middle" font-size="19" font-weight="600">Verify Customer PIN</text>

  <!-- Actor associations: solid, undirected lines -->
  <line x1="120" y1="287" x2="245" y2="180" stroke="#111827" stroke-width="1.8"/>
  <line x1="90" y1="300" x2="245" y2="500" stroke="#111827" stroke-width="1.8"/>
  <line x1="940" y1="347" x2="855" y2="350" stroke="#111827" stroke-width="1.8"/>

  <!-- Extend: extension use case to base use case, dashed line with open arrowhead -->
  <line x1="585" y1="220" x2="515" y2="180" stroke="#111827" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#openArrow)"/>
  <rect x="513" y="149" width="92" height="24" fill="#fff"/>
  <text x="520" y="167" font-size="16" font-weight="600">«extend»</text>

  <!-- Include: base use case to included use case, dashed lines with open arrowheads -->
  <line x1="500" y1="205" x2="610" y2="310" stroke="#111827" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#openArrow)"/>
  <rect x="476" y="236" width="92" height="25" fill="#fff"/>
  <text x="482" y="254" font-size="16" font-weight="600">«include»</text>
  <line x1="500" y1="475" x2="610" y2="390" stroke="#111827" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#openArrow)"/>
  <rect x="522" y="429" width="92" height="25" fill="#fff"/>
  <text x="528" y="447" font-size="16" font-weight="600">«include»</text>

  <!-- UML note attached to the Extend relationship -->
  <path d="M 620 70 H 850 V 135 H 620 L 606 121 V 70 Z" fill="#fff" stroke="#111827" stroke-width="1.4"/>
  <path d="M 606 121 H 620 V 135" fill="none" stroke="#111827" stroke-width="1.2"/>
  <text x="630" y="95" font-size="15">Condition: {balance &lt; 0}</text>
  <text x="630" y="118" font-size="15">Extension point: balanceChecked</text>
  <path d="M 620 103 H 570 V 200 H 550" fill="none" stroke="#111827" stroke-width="1.2" stroke-dasharray="4 4"/>
</svg>
</div>
</body>
</html>
