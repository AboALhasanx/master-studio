<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #diagram { width: 1040px; background: #ffffff; padding: 20px; box-sizing: border-box; }
  text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<div id="diagram">
<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <filter id="cShadow" x="-2%" y="-4%" width="104%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <rect x="15" y="10" width="970" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="35" y="32" font-size="15" font-weight="700" fill="#0f172a">Function Point Analysis (FPA) Architecture &amp; Calculation Pipeline</text>
  <text x="35" y="48" font-size="11.5" font-weight="600" fill="#64748b">5 Information Domain Units → Unadjusted FP (UFP) → 14 GSC Factors (CAF) → Final Adjusted FP</text>
  <text x="965" y="40" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="end">K.K. Aggarwal &amp; Yogesh Singh (pp. 145–148) · Slides 9–22</text>

  <!-- Stage 1: 5 Information Domain Characteristics -->
  <g transform="translate(20, 80)" filter="url(#cShadow)">
    <rect width="260" height="410" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="0" y="0" width="260" height="36" rx="8" fill="#3b82f6"/>
    <text x="130" y="23" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1. Information Domain Units</text>

    <!-- EI -->
    <rect x="12" y="48" width="236" height="62" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="22" y="68" font-size="11.5" font-weight="700" fill="#1e40af">External Inputs (EI)</text>
    <text x="22" y="84" font-size="10.5" fill="#475569">Data entering system boundary</text>
    <text x="22" y="99" font-size="10" font-weight="600" fill="#2563eb">Weights: Low=3 · Avg=4 · High=6</text>

    <!-- EO -->
    <rect x="12" y="118" width="236" height="62" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="22" y="138" font-size="11.5" font-weight="700" fill="#1e40af">External Outputs (EO)</text>
    <text x="22" y="154" font-size="10.5" fill="#475569">Processed data leaving system</text>
    <text x="22" y="169" font-size="10" font-weight="600" fill="#2563eb">Weights: Low=4 · Avg=5 · High=7</text>

    <!-- EQ -->
    <rect x="12" y="188" width="236" height="62" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="22" y="208" font-size="11.5" font-weight="700" fill="#1e40af">External Inquiries (EQ)</text>
    <text x="22" y="224" font-size="10.5" fill="#475569">Interactive input with lookup output</text>
    <text x="22" y="239" font-size="10" font-weight="600" fill="#2563eb">Weights: Low=3 · Avg=4 · High=6</text>

    <!-- ILF -->
    <rect x="12" y="258" width="236" height="66" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="22" y="278" font-size="11.5" font-weight="700" fill="#1e40af">Internal Logical Files (ILF)</text>
    <text x="22" y="294" font-size="10.5" fill="#475569">User data maintained internally</text>
    <text x="22" y="310" font-size="10" font-weight="700" fill="#b91c1c">Weights: Low=7 · Avg=10 · High=15 (Max!)</text>

    <!-- EIF -->
    <rect x="12" y="332" width="236" height="62" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="22" y="352" font-size="11.5" font-weight="700" fill="#1e40af">External Interface Files (EIF)</text>
    <text x="22" y="368" font-size="10.5" fill="#475569">Data maintained by other systems</text>
    <text x="22" y="383" font-size="10" font-weight="600" fill="#2563eb">Weights: Low=5 · Avg=7 · High=10</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="285" y1="285" x2="320" y2="285" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrB)"/>

  <!-- Stage 2: UFP Summation -->
  <g transform="translate(325, 175)" filter="url(#cShadow)">
    <rect width="180" height="220" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#475569"/>
    <text x="90" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2. Unadjusted FP (UFP)</text>

    <text x="90" y="60" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Sum of Weighted Counts</text>
    <rect x="15" y="75" width="150" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="90" y="98" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">UFP = Σ Σ Wij · Zij</text>
    <text x="90" y="114" font-size="10" fill="#64748b" text-anchor="middle">i=1..5 (types) · j=1..3 (levels)</text>

    <rect x="15" y="140" width="150" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="90" y="158" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">Language Independence</text>
    <text x="90" y="174" font-size="9.5" fill="#475569" text-anchor="middle">Measures pure user functionality</text>
    <text x="90" y="190" font-size="9.5" fill="#475569" text-anchor="middle">Counts classified by complexity</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="510" y1="285" x2="545" y2="285" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrB)"/>

  <!-- Stage 3: 14 GSC Factors & CAF -->
  <g transform="translate(550, 100)" filter="url(#cShadow)">
    <rect width="220" height="370" rx="8" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.6"/>
    <rect x="0" y="0" width="220" height="34" rx="8" fill="#9333ea"/>
    <text x="110" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3. Complexity Adjustment (CAF)</text>

    <rect x="12" y="45" width="196" height="70" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
    <text x="110" y="65" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">14 General System Characteristics</text>
    <text x="110" y="80" font-size="10" fill="#64748b" text-anchor="middle">Rated 0 (none) to 5 (essential)</text>
    <text x="110" y="98" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Σ Fi Range: 0 to 70</text>

    <!-- 14 factors list snippet -->
    <rect x="12" y="125" width="196" height="135" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
    <text x="20" y="142" font-size="9.5" fill="#475569">1. Data Communications</text>
    <text x="20" y="156" font-size="9.5" fill="#475569">2. Distributed Data Processing</text>
    <text x="20" y="170" font-size="9.5" fill="#475569">3. Performance Objectives</text>
    <text x="20" y="184" font-size="9.5" fill="#475569">4. Heavily Used Configuration</text>
    <text x="20" y="198" font-size="9.5" fill="#475569">5. Transaction Rate</text>
    <text x="20" y="212" font-size="9.5" fill="#475569">6. Online Data Entry ... (to 14)</text>
    <text x="20" y="228" font-size="9.5" fill="#475569">14. Facilitate Change</text>
    <text x="20" y="248" font-size="9.5" font-weight="600" fill="#7e22ce">14 GSCs collectively adjust size</text>

    <!-- CAF Equation -->
    <rect x="12" y="270" width="196" height="85" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.2"/>
    <text x="110" y="290" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">CAF Equation</text>
    <text x="110" y="312" font-size="11.5" font-weight="700" fill="#7e22ce" text-anchor="middle">CAF = 0.65 + 0.01 · Σ Fi</text>
    <text x="110" y="332" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Range: 0.65 to 1.35 (±35%)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="775" y1="285" x2="810" y2="285" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arrG)"/>

  <!-- Stage 4: Final FP Output -->
  <g transform="translate(815, 175)" filter="url(#cShadow)">
    <rect width="165" height="220" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
    <rect x="0" y="0" width="165" height="34" rx="8" fill="#16a34a"/>
    <text x="82" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4. Final Function Points</text>

    <rect x="12" y="55" width="141" height="65" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.4"/>
    <text x="82" y="80" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Governing Law:</text>
    <text x="82" y="104" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">FP = UFP × CAF</text>

    <rect x="12" y="130" width="141" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="148" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">Adjusted Size</text>
    <text x="82" y="170" font-size="9.5" fill="#475569" text-anchor="middle">The final FP count</text>
    <text x="82" y="187" font-size="9.5" fill="#475569" text-anchor="middle">after complexity adjustment</text>
  </g>
</svg>
</div>
</body>
</html>
