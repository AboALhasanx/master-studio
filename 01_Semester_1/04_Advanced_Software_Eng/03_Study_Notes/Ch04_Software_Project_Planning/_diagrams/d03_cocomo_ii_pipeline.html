<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #diagram { width: 1040px; background: #ffffff; padding: 20px; box-sizing: border-box; }
  text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<div id="diagram">
<svg width="1000" height="570" viewBox="0 0 1000 570" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <filter id="cShadow" x="-2%" y="-4%" width="104%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <rect x="15" y="10" width="970" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="35" y="32" font-size="15" font-weight="700" fill="#0f172a">COCOMO II Three-Stage Estimation Pipeline &amp; Lifecycle Progression</text>
  <text x="35" y="48" font-size="11.5" font-weight="600" fill="#64748b">Stage 1: Application Composition → Stage 2: Early Design → Stage 3: Post-Architecture</text>
  <text x="965" y="40" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="end">Barry Boehm et al. (USC CSE) · K.K. Aggarwal pp. 161–171</text>

  <!-- Top Banner: 4 Application Categories -->
  <g transform="translate(20, 75)" filter="url(#cShadow)">
    <rect width="960" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="25" y="28" font-size="11.5" font-weight="700" fill="#1e293b">Target Application Sectors:</text>
    <rect x="195" y="10" width="170" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="280" y="28" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">1. End-User Programming</text>

    <rect x="380" y="10" width="180" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="470" y="28" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">2. Application Composition</text>

    <rect x="575" y="10" width="165" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="657" y="28" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">3. System Integration</text>

    <rect x="755" y="10" width="190" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="850" y="28" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">4. Infrastructure Sector</text>
  </g>

  <!-- Stage 1 Box -->
  <g transform="translate(20, 145)" filter="url(#cShadow)">
    <rect width="295" height="360" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="0" y="0" width="295" height="34" rx="8" fill="#2563eb"/>
    <text x="147" y="22" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Stage 1: Application Composition</text>

    <rect x="12" y="46" width="271" height="58" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="20" y="66" font-size="11" font-weight="700" fill="#1e40af">Lifecycle Milestones:</text>
    <text x="20" y="82" font-size="10" fill="#475569">• Prototyping &amp; exploration phase</text>
    <text x="20" y="96" font-size="10" fill="#475569">• Rapid GUI &amp; workflow generation</text>

    <rect x="12" y="114" width="271" height="96" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="20" y="132" font-size="11" font-weight="700" fill="#1e40af">Sizing Metric: Object Points (OP)</text>
    <text x="20" y="148" font-size="10" fill="#475569">• Screens (Simple=1, Medium=2, Difficult=3)</text>
    <text x="20" y="162" font-size="10" fill="#475569">• Reports (Simple=2, Medium=5, Difficult=8)</text>
    <text x="20" y="176" font-size="10" fill="#475569">• 3GL modules (Complexity = 10)</text>
    <text x="20" y="196" font-size="10.5" font-weight="700" fill="#2563eb">NOP = OP × (100 - %Reuse) / 100</text>

    <rect x="12" y="220" width="271" height="120" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="20" y="240" font-size="11" font-weight="700" fill="#166534">Effort Formula:</text>
    <text x="20" y="262" font-size="12" font-weight="700" fill="#15803d">Effort (PM) = NOP / PROD</text>
    <text x="20" y="282" font-size="10" fill="#475569">Productivity Rates (PROD):</text>
    <text x="20" y="298" font-size="9.5" fill="#334155">• Very Low = 4 · Low = 7 · Nominal = 13</text>
    <text x="20" y="314" font-size="9.5" fill="#334155">• High = 25 · Very High = 50</text>
    <text x="20" y="330" font-size="9.5" font-weight="600" fill="#15803d">Zero cost drivers in this early stage</text>
  </g>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <line x1="325" y1="325" x2="350" y2="325" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrB)"/>

  <!-- Stage 2 Box -->
  <g transform="translate(355, 145)" filter="url(#cShadow)">
    <rect width="290" height="360" rx="8" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.6"/>
    <rect x="0" y="0" width="290" height="34" rx="8" fill="#9333ea"/>
    <text x="145" y="22" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Stage 2: The Early Design Model</text>

    <rect x="12" y="46" width="266" height="58" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
    <text x="20" y="66" font-size="11" font-weight="700" fill="#7e22ce">Lifecycle Milestones:</text>
    <text x="20" y="82" font-size="10" fill="#475569">• Exploration of architectural options</text>
    <text x="20" y="96" font-size="10" fill="#475569">• Prior to freezing detailed specifications</text>

    <rect x="12" y="114" width="266" height="106" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
    <text x="20" y="132" font-size="11" font-weight="700" fill="#7e22ce">Sizing &amp; Base Equations:</text>
    <text x="20" y="150" font-size="10.5" font-weight="700" fill="#0f172a">PMnominal = 2.5 × (Size)ᴮ</text>
    <text x="20" y="168" font-size="10" fill="#475569">• Sized via Function Points or KLOC</text>
    <text x="20" y="186" font-size="10.5" font-weight="700" fill="#9333ea">B = 0.91 + 0.01 · Σ SFj (5 factors)</text>
    <text x="20" y="204" font-size="9.5" fill="#64748b">Scale factors range B from 0.91 to 1.23</text>

    <rect x="12" y="230" width="266" height="110" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
    <text x="20" y="248" font-size="10.5" font-weight="700" fill="#6b21a8">7 Early Design Cost Drivers:</text>
    <text x="20" y="266" font-size="9.5" fill="#334155">1. RCPX (Reliability &amp; Complexity)</text>
    <text x="20" y="280" font-size="9.5" fill="#334155">2. RUSE (Reuse) · 3. PDIF (Platform)</text>
    <text x="20" y="294" font-size="9.5" fill="#334155">4. PERS (Capability) · 5. PREX (Experience)</text>
    <text x="20" y="308" font-size="9.5" fill="#334155">6. FCIL (Facilities) · 7. SCED (Schedule)</text>
    <text x="20" y="328" font-size="10" font-weight="700" fill="#7e22ce">PM = PMnominal × Π EMi (7 drivers)</text>
  </g>

  <!-- Arrow Stage 2 -> Stage 3 -->
  <line x1="655" y1="325" x2="680" y2="325" stroke="#9333ea" stroke-width="2.2" marker-end="url(#arrB)"/>

  <!-- Stage 3 Box -->
  <g transform="translate(685, 145)" filter="url(#cShadow)">
    <rect width="295" height="400" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
    <rect x="0" y="0" width="295" height="34" rx="8" fill="#16a34a"/>
    <text x="147" y="22" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Stage 3: Post-Architecture Model</text>

    <rect x="12" y="46" width="271" height="58" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="20" y="66" font-size="11" font-weight="700" fill="#15803d">Lifecycle Milestones:</text>
    <text x="20" y="82" font-size="10" fill="#475569">• Full development &amp; integration phase</text>
    <text x="20" y="96" font-size="10" font-weight="700" fill="#166534">After the architecture is baselined</text>

    <rect x="12" y="114" width="271" height="96" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="20" y="132" font-size="11" font-weight="700" fill="#15803d">Sizing &amp; Scale Factors:</text>
    <text x="20" y="150" font-size="10.5" font-weight="700" fill="#0f172a">PMnominal = 2.94 × (Size)ᴮ</text>
    <text x="20" y="168" font-size="10" fill="#475569">• Sized via SLOC or FP with reuse model</text>
    <text x="20" y="186" font-size="10.5" font-weight="700" fill="#15803d">B = 0.91 + 0.01 · Σ SFj (5 factors)</text>
    <text x="20" y="202" font-size="9" fill="#64748b">PREC, FLEX, RESL, TEAM, PMAT</text>

    <rect x="12" y="220" width="271" height="166" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="20" y="238" font-size="10.5" font-weight="700" fill="#15803d">17 Detailed Cost Drivers:</text>
    <text x="20" y="254" font-size="9" fill="#334155">• Product (5): RELY, DATA, CPLX, RUSE, DOCU</text>
    <text x="20" y="268" font-size="9" fill="#334155">• Platform (3): TIME, STOR, PVOL</text>
    <text x="20" y="282" font-size="9" fill="#334155">• Personnel (6): ACAP, PCAP, PCON, AEXP, PEXP, LTEX</text>
    <text x="20" y="296" font-size="9" fill="#334155">• Project (3): TOOL, SITE, SCED</text>
    <text x="20" y="316" font-size="10" font-weight="700" fill="#166534">PM = PMnominal × Π EMi (17 drivers)</text>
    <text x="20" y="332" font-size="8.6" font-weight="600" fill="#1e293b">TDEV = 3.67 × (PMnom)ᶠ × SCED% / 100</text>
    <text x="20" y="347" font-size="8.2" fill="#475569">f = 0.28 + 0.2(B − 0.91)</text>
  </g>
</svg>
</div>
</body>
</html>
