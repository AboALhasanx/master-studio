<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #diagram { width: 1040px; background: #ffffff; padding: 20px; box-sizing: border-box; }
  text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<div id="diagram">
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e3a8a"/>
    </marker>
    <filter id="cShadow" x="-2%" y="-4%" width="104%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <rect x="15" y="10" width="970" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="35" y="43" font-size="20" font-weight="700" fill="#0f172a">Unified Process (UP / RUP) — Two-Dimensional Matrix Architecture</text>
  <text x="965" y="43" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">K.K. Aggarwal Slides 24–36 · Sommerville §2.4, pp. 67–69</text>

  <!-- Top Dynamic Timeline Banner -->
  <g transform="translate(230, 75)">
    <rect width="745" height="28" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="372" y="19" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">DYNAMIC TIME DIMENSION (PHASES &amp; REPETITIVE ITERATIONS)</text>
    <line x1="20" y1="14" x2="725" y2="14" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="8 4" marker-end="url(#arrU)"/>
  </g>

  <!-- Phase Column Headers (4 Columns) -->
  <!-- Col 1: Inception -->
  <g transform="translate(230, 110)">
    <rect width="180" height="42" rx="6" fill="#1d4ed8"/>
    <text x="90" y="26" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">INCEPTION</text>
  </g>
  <!-- Col 2: Elaboration -->
  <g transform="translate(415, 110)">
    <rect width="185" height="42" rx="6" fill="#6d28d9"/>
    <text x="92" y="26" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">ELABORATION</text>
  </g>
  <!-- Col 3: Construction -->
  <g transform="translate(605, 110)">
    <rect width="185" height="42" rx="6" fill="#b45309"/>
    <text x="92" y="26" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">CONSTRUCTION</text>
  </g>
  <!-- Col 4: Transition -->
  <g transform="translate(795, 110)">
    <rect width="180" height="42" rx="6" fill="#047857"/>
    <text x="90" y="26" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">TRANSITION</text>
  </g>

  <!-- Iteration Sub-Headers -->
  <g transform="translate(230, 155)" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="middle">
    <!-- Inception iter -->
    <rect x="0" y="0" width="180" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="90" y="14">Iteration I-1</text>
    <!-- Elaboration iter -->
    <rect x="185" y="0" width="92" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="231" y="14">Iter E-1</text>
    <rect x="278" y="0" width="92" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="324" y="14">Iter E-2</text>
    <!-- Construction iter -->
    <rect x="375" y="0" width="61" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="405" y="14">C-1</text>
    <rect x="437" y="0" width="61" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="467" y="14">C-2</text>
    <rect x="499" y="0" width="61" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="529" y="14">C-3</text>
    <!-- Transition iter -->
    <rect x="565" y="0" width="90" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="610" y="14">Iter T-1</text>
    <rect x="655" y="0" width="90" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="700" y="14">Iter T-2</text>
  </g>

  <!-- ==================== WORKFLOWS (ROWS) & DYNAMIC EFFORT MATRIX ==================== -->
  
  <!-- Left Header: Engineering Workflows -->
  <g transform="translate(15, 110)">
    <rect width="205" height="315" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="0" y="0" width="205" height="42" rx="6" fill="#334155"/>
    <text x="102" y="20" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">STATIC ENGINEERING</text>
    <text x="102" y="34" font-size="11.5" font-weight="700" fill="#93c5fd" text-anchor="middle">WORKFLOWS (Disciplines)</text>
    
    <!-- 6 Core Engineering Workflow Labels -->
    <g transform="translate(15, 55)" font-size="12" font-weight="700" fill="#1e293b">
      <text y="24">1. Business Modeling</text>
      <text y="66">2. Requirements</text>
      <text y="108">3. Analysis &amp; Design</text>
      <text y="150">4. Implementation</text>
      <text y="192">5. Testing</text>
      <text y="234">6. Deployment</text>
    </g>
  </g>

  <!-- Matrix Grid Rows (y starts at 180, row height = 42) -->
  
  <!-- Row 1: Business Modeling (Active in Inception, tapers) -->
  <g transform="translate(230, 180)">
    <rect x="0" y="0" width="745" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="10" y="6" width="160" height="26" rx="4" fill="#1d4ed8"/>
    <rect x="195" y="9" width="165" height="20" rx="4" fill="#93c5fd"/>
    <rect x="385" y="12" width="165" height="14" rx="3" fill="#e2e8f0"/>
    <rect x="575" y="13" width="160" height="12" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- Row 2: Requirements (Peaks in Inception & Elaboration) -->
  <g transform="translate(230, 222)">
    <rect x="0" y="0" width="745" height="38" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="10" y="6" width="160" height="26" rx="4" fill="#1d4ed8"/>
    <rect x="195" y="6" width="165" height="26" rx="4" fill="#1d4ed8"/>
    <rect x="385" y="9" width="165" height="20" rx="4" fill="#93c5fd"/>
    <rect x="575" y="13" width="160" height="12" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- Row 3: Analysis & Design (Peaks in Elaboration) -->
  <g transform="translate(230, 264)">
    <rect x="0" y="0" width="745" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="10" y="12" width="160" height="14" rx="3" fill="#e2e8f0"/>
    <rect x="195" y="6" width="165" height="26" rx="4" fill="#6d28d9"/>
    <rect x="385" y="6" width="165" height="26" rx="4" fill="#93c5fd"/>
    <rect x="575" y="12" width="160" height="14" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- Row 4: Implementation (Heavy in Construction) -->
  <g transform="translate(230, 306)">
    <rect x="0" y="0" width="745" height="38" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="10" y="13" width="160" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="195" y="9" width="165" height="20" rx="4" fill="#c4b5fd"/>
    <rect x="385" y="6" width="165" height="26" rx="4" fill="#b45309"/>
    <rect x="575" y="9" width="160" height="20" rx="4" fill="#fde68a"/>
  </g>

  <!-- Row 5: Testing (Rises in Construction, Peaks in Transition) -->
  <g transform="translate(230, 348)">
    <rect x="0" y="0" width="745" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="10" y="13" width="160" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="195" y="11" width="165" height="16" rx="3" fill="#e2e8f0"/>
    <rect x="385" y="6" width="165" height="26" rx="4" fill="#b45309"/>
    <rect x="575" y="6" width="160" height="26" rx="4" fill="#047857"/>
  </g>

  <!-- Row 6: Deployment (Peaks in Transition) -->
  <g transform="translate(230, 390)">
    <rect x="0" y="0" width="745" height="38" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="10" y="13" width="160" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="195" y="13" width="165" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="385" y="10" width="165" height="18" rx="3" fill="#fde68a"/>
    <rect x="575" y="6" width="160" height="26" rx="4" fill="#047857"/>
  </g>

  <!-- Effort Legend -->
  <g transform="translate(15, 435)" font-size="11" font-weight="600" fill="#475569">
    <text x="0" y="14" font-weight="700" fill="#0f172a">Workflow Effort Key:</text>
    <rect x="125" y="3" width="18" height="14" rx="3" fill="#1d4ed8"/>
    <text x="148" y="14">Primary (High)</text>
    <rect x="235" y="3" width="18" height="14" rx="3" fill="#93c5fd"/>
    <text x="258" y="14">Medium</text>
    <rect x="315" y="3" width="18" height="14" rx="3" fill="#e2e8f0"/>
    <text x="338" y="14">Light / Incidental</text>
  </g>

  <!-- ==================== FORMAL MILESTONE GATES & DELIVERABLES (BOTTOM) ==================== -->
  
  <!-- Gate 1: LCO -->
  <g transform="translate(230, 460)" filter="url(#cShadow)">
    <rect width="180" height="85" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#1d4ed8"/>
    <text x="90" y="16" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Milestone: LCO</text>
    <text x="90" y="32" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">(Lifecycle Objectives)</text>
    <text x="12" y="50" font-size="10" fill="#334155">• Vision &amp; Business Case</text>
    <text x="12" y="64" font-size="10" fill="#334155">• Initial Risk Evaluation</text>
    <text x="12" y="78" font-size="10" fill="#334155">• Core Use-Case Survey</text>
  </g>

  <!-- Gate 2: LCA -->
  <g transform="translate(415, 460)" filter="url(#cShadow)">
    <rect width="185" height="85" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
    <rect x="0" y="0" width="185" height="24" rx="6" fill="#6d28d9"/>
    <text x="92" y="16" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Milestone: LCA</text>
    <text x="92" y="32" font-size="10.5" font-weight="700" fill="#5b21b6" text-anchor="middle">(Lifecycle Architecture)</text>
    <text x="12" y="50" font-size="10" fill="#334155">• Executable Architecture</text>
    <text x="12" y="64" font-size="10" fill="#334155">• Top Risks Mitigated</text>
    <text x="12" y="78" font-size="10" fill="#334155">• Use-Case Model Finalized</text>
  </g>

  <!-- Gate 3: IOC -->
  <g transform="translate(605, 460)" filter="url(#cShadow)">
    <rect width="185" height="85" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
    <rect x="0" y="0" width="185" height="24" rx="6" fill="#b45309"/>
    <text x="92" y="16" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Milestone: IOC</text>
    <text x="92" y="32" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">(Initial Operational Capability)</text>
    <text x="12" y="50" font-size="10" fill="#334155">• Beta Software Release</text>
    <text x="12" y="64" font-size="10" fill="#334155">• All Core Components Built</text>
    <text x="12" y="78" font-size="10" fill="#334155">• User Manuals Prepared</text>
  </g>

  <!-- Gate 4: PR -->
  <g transform="translate(795, 460)" filter="url(#cShadow)">
    <rect width="180" height="85" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.6"/>
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#047857"/>
    <text x="90" y="16" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Milestone: PR</text>
    <text x="90" y="32" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">(Product Release)</text>
    <text x="12" y="50" font-size="10" fill="#334155">• Final Software Product</text>
    <text x="12" y="64" font-size="10" fill="#334155">• User Acceptance Complete</text>
    <text x="12" y="78" font-size="10" fill="#334155">• Full Operational Readiness</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="15" y="555" width="970" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="577" font-size="12" fill="#334155" text-anchor="middle">
    <tspan font-weight="700" fill="#0f172a">Academic Rule (Sommerville §2.4):</tspan> Phases are dynamic time containers governed by business decisions; Workflows are technical disciplines enacted in varying degrees during every single iteration.
  </text>

</svg>
</div>
</body>
</html>
