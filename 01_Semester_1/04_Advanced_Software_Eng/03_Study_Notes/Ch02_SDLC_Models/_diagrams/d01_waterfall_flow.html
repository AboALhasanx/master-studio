<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #diagram { width: 1040px; background: #ffffff; padding: 15px; box-sizing: border-box; }
  text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<div id="diagram">
<svg width="1000" height="435" viewBox="0 0 1000 435" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-4%" width="104%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Title & Course Header -->
  <rect x="15" y="8" width="970" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="35" y="35" font-size="17.5" font-weight="700" fill="#0f172a">Classical Waterfall Model — Linear Sequential Life Cycle Architecture</text>
  <text x="965" y="35" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">B.B. Agarwal et al. (Fig. 2.3, p. 37) · K.K. Aggarwal Slide 6</text>

  <!-- Left Dimension Indicator (Linear Flow Direction) -->
  <line x1="55" y1="70" x2="55" y2="380" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrV)"/>
  <text x="42" y="225" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle" transform="rotate(-90 42 225)" letter-spacing="1.2">STRICT LINEAR CASCADE</text>

  <!-- ==================== PHASE 1: FEASIBILITY STUDY ==================== -->
  <g transform="translate(85, 62)" filter="url(#cardShadow)">
    <rect width="450" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="32" height="40" rx="6" fill="#2563eb"/>
    <text x="16" y="25" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="45" y="25" font-size="14" font-weight="700" fill="#1e3a8a">Feasibility Study</text>
  </g>
  <line x1="535" y1="82" x2="575" y2="82" stroke="#3b82f6" stroke-width="1.5"/>
  <g transform="translate(575, 64)" filter="url(#cardShadow)">
    <rect width="405" height="36" rx="5" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.2"/>
    <rect x="0" y="0" width="5" height="36" rx="2" fill="#3b82f6"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#1e40af">Deliverable:</text>
    <text x="80" y="22" font-size="11.5" fill="#334155">Feasibility Report &amp; Project Scope Charter</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="310" y1="102" x2="310" y2="114" stroke="#2563eb" stroke-width="2" marker-end="url(#arrV)"/>

  <!-- ==================== PHASE 2: REQUIREMENTS ANALYSIS ==================== -->
  <g transform="translate(85, 116)" filter="url(#cardShadow)">
    <rect width="450" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="32" height="40" rx="6" fill="#2563eb"/>
    <text x="16" y="25" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="45" y="25" font-size="13.5" font-weight="700" fill="#1e3a8a">Requirements Analysis &amp; Specification</text>
  </g>
  <line x1="535" y1="136" x2="575" y2="136" stroke="#3b82f6" stroke-width="1.5"/>
  <g transform="translate(575, 118)" filter="url(#cardShadow)">
    <rect width="405" height="36" rx="5" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.2"/>
    <rect x="0" y="0" width="5" height="36" rx="2" fill="#3b82f6"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#1e40af">Deliverable:</text>
    <text x="80" y="22" font-size="11.5" font-weight="600" fill="#0f172a">Software Requirements Specification (SRS)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="310" y1="156" x2="310" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#arrV)"/>

  <!-- ==================== PHASE 3: DESIGN & SPECIFICATION ==================== -->
  <g transform="translate(85, 170)" filter="url(#cardShadow)">
    <rect width="450" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="32" height="40" rx="6" fill="#2563eb"/>
    <text x="16" y="25" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="45" y="25" font-size="14" font-weight="700" fill="#1e3a8a">Design &amp; Specification</text>
  </g>
  <line x1="535" y1="190" x2="575" y2="190" stroke="#3b82f6" stroke-width="1.5"/>
  <g transform="translate(575, 172)" filter="url(#cardShadow)">
    <rect width="405" height="36" rx="5" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.2"/>
    <rect x="0" y="0" width="5" height="36" rx="2" fill="#3b82f6"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#1e40af">Deliverable:</text>
    <text x="80" y="22" font-size="11.5" fill="#334155">Software Architecture Models (HLD &amp; LLD)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="310" y1="210" x2="310" y2="222" stroke="#2563eb" stroke-width="2" marker-end="url(#arrV)"/>

  <!-- ==================== PHASE 4: CODING & MODULE TESTING ==================== -->
  <g transform="translate(85, 224)" filter="url(#cardShadow)">
    <rect width="450" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="32" height="40" rx="6" fill="#2563eb"/>
    <text x="16" y="25" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="45" y="25" font-size="14" font-weight="700" fill="#1e3a8a">Coding &amp; Module Testing</text>
  </g>
  <line x1="535" y1="244" x2="575" y2="244" stroke="#3b82f6" stroke-width="1.5"/>
  <g transform="translate(575, 226)" filter="url(#cardShadow)">
    <rect width="405" height="36" rx="5" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.2"/>
    <rect x="0" y="0" width="5" height="36" rx="2" fill="#3b82f6"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#1e40af">Deliverable:</text>
    <text x="80" y="22" font-size="11.5" fill="#334155">Unit-Tested Source Code &amp; Test Logs</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="310" y1="264" x2="310" y2="276" stroke="#2563eb" stroke-width="2" marker-end="url(#arrV)"/>

  <!-- ==================== PHASE 5: INTEGRATION & SYSTEM TESTING ==================== -->
  <g transform="translate(85, 278)" filter="url(#cardShadow)">
    <rect width="450" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="32" height="40" rx="6" fill="#2563eb"/>
    <text x="16" y="25" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="45" y="25" font-size="14" font-weight="700" fill="#1e3a8a">Integration &amp; System Testing</text>
  </g>
  <line x1="535" y1="298" x2="575" y2="298" stroke="#3b82f6" stroke-width="1.5"/>
  <g transform="translate(575, 280)" filter="url(#cardShadow)">
    <rect width="405" height="36" rx="5" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.2"/>
    <rect x="0" y="0" width="5" height="36" rx="2" fill="#3b82f6"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#1e40af">Deliverable:</text>
    <text x="80" y="22" font-size="11.5" font-weight="600" fill="#0f172a">Verified, Integrated Software Release</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="310" y1="318" x2="310" y2="330" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- ==================== PHASE 6: DELIVERY & MAINTENANCE ==================== -->
  <g transform="translate(85, 332)" filter="url(#cardShadow)">
    <rect width="450" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="32" height="40" rx="6" fill="#16a34a"/>
    <text x="16" y="25" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <text x="45" y="25" font-size="14" font-weight="700" fill="#14532d">Delivery &amp; Maintenance</text>
  </g>
  <line x1="535" y1="352" x2="575" y2="352" stroke="#16a34a" stroke-width="1.5"/>
  <g transform="translate(575, 334)" filter="url(#cardShadow)">
    <rect width="405" height="36" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect x="0" y="0" width="5" height="36" rx="2" fill="#16a34a"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#15803d">Deliverable:</text>
    <text x="80" y="22" font-size="11.5" fill="#14532d">Operational System &amp; Maintenance Logs</text>
  </g>

  <!-- Bottom Governance Footer -->
  <rect x="15" y="385" width="970" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="405" font-size="11.5" fill="#475569" text-anchor="middle">
    <tspan font-weight="700" fill="#0f172a">Classical Invariant:</tspan> Each phase must freeze its signed deliverables before the next phase begins. No feedback loops exist in pure model.
  </text>

</svg>
</div>
</body>
</html>
