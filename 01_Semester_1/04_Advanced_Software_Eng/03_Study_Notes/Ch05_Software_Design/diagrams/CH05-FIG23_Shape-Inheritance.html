<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; background:#fff; font-family: Arial, Helvetica, sans-serif; }
  #diagram { width:1200px; height:740px; margin:0 auto; background:#fff; }
  svg { width:1200px; height:740px; display:block; }
  .classbox { fill:#fff; stroke:#202938; stroke-width:2.5; }
  .divider { stroke:#202938; stroke-width:2; }
  .name { font-size:26px; font-weight:700; fill:#172554; }
  .member { font-size:22px; fill:#111827; }
  .caption { font-size:18px; fill:#475569; }
  .relation { fill:none; stroke:#111827; stroke-width:2.5; }
  .label { font-size:18px; fill:#334155; }
</style>
</head>
<body>
<div id="diagram">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Class diagram: Shape superclass with Square and Triangle subclasses</title>
  <desc id="desc">Square and Triangle inherit from Shape. Shape has Colour, Set Colour(), and Draw(). Square has Point[4] and Draw(). Triangle has Point[3] and Draw().</desc>
  <defs>
    <marker id="generalization" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L16,9 L1,17 Z" fill="#fff" stroke="#111827" stroke-width="1.7"/>
    </marker>
  </defs>
  <!-- Generalization points from each subclass to the superclass. -->
  <path class="relation" d="M350 470 L505 292" marker-end="url(#generalization)"/>
  <path class="relation" d="M850 470 L695 292" marker-end="url(#generalization)"/>
  <text class="label" x="375" y="370" transform="rotate(-49 375 370)">inherits</text>
  <text class="label" x="785" y="370" transform="rotate(49 785 370)">inherits</text>

  <text class="caption" x="600" y="36" text-anchor="middle">Class shape — base class (superclass)</text>
  <g transform="translate(420 55)">
    <rect class="classbox" width="360" height="235"/>
    <line class="divider" x1="0" y1="58" x2="360" y2="58"/>
    <line class="divider" x1="0" y1="120" x2="360" y2="120"/>
    <text class="name" x="180" y="40" text-anchor="middle">Shape</text>
    <text class="member" x="22" y="98">Colour</text>
    <text class="member" x="22" y="162">Set Colour()</text>
    <text class="member" x="22" y="203">Draw()</text>
  </g>

  <text class="caption" x="315" y="442" text-anchor="middle">Class square</text>
  <g transform="translate(135 470)">
    <rect class="classbox" width="360" height="190"/>
    <line class="divider" x1="0" y1="58" x2="360" y2="58"/>
    <line class="divider" x1="0" y1="120" x2="360" y2="120"/>
    <text class="name" x="180" y="40" text-anchor="middle">Square</text>
    <text class="member" x="22" y="99">Point[4]</text>
    <text class="member" x="22" y="162">Draw()</text>
  </g>

  <text class="caption" x="885" y="442" text-anchor="middle">Class triangle</text>
  <g transform="translate(705 470)">
    <rect class="classbox" width="360" height="190"/>
    <line class="divider" x1="0" y1="58" x2="360" y2="58"/>
    <line class="divider" x1="0" y1="120" x2="360" y2="120"/>
    <text class="name" x="180" y="40" text-anchor="middle">Triangle</text>
    <text class="member" x="22" y="99">Point[3]</text>
    <text class="member" x="22" y="162">Draw()</text>
  </g>
  <text class="caption" x="600" y="710" text-anchor="middle">Inheritance generalization: Square and Triangle inherit state/behavior from Shape.</text>
</svg>
</div>
</body>
</html>
