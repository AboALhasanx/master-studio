<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  svg { display: block; }
  text { font-family: 'Segoe UI', Arial, sans-serif; }
</style>
</head>
<body>
<svg width="1000" height="580" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg">

  <!-- plot frame -->
  <line x1="95" y1="60"  x2="95"  y2="470" stroke="#334155" stroke-width="2"/>
  <line x1="95" y1="470" x2="950" y2="470" stroke="#334155" stroke-width="2"/>

  <!-- phase boundaries -->
  <line x1="330" y1="60" x2="330" y2="470" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="700" y1="60" x2="700" y2="470" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- phase captions -->
  <text x="212" y="500" font-size="16" fill="#475569" text-anchor="middle">Burn-in</text>
  <text x="515" y="500" font-size="16" fill="#475569" text-anchor="middle">Useful life</text>
  <text x="825" y="500" font-size="16" fill="#475569" text-anchor="middle">Wear out</text>

  <!-- hardware curve: bathtub (dashed) -->
  <path d="M95,175 C160,300 240,405 330,412 L700,412 C790,405 880,300 950,150"
        fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-dasharray="9 6"/>

  <!-- software curve: descending only (solid, highlighted) -->
  <path d="M95,190 C220,330 340,400 500,428 L950,436"
        fill="none" stroke="#0f766e" stroke-width="4.5"/>

  <!-- axis labels -->
  <text x="60" y="270" font-size="17" fill="#0f172a" text-anchor="middle"
        transform="rotate(-90 60 270)">Failure intensity</text>
  <text x="915" y="510" font-size="17" fill="#0f172a" text-anchor="end">Time</text>

  <!-- annotation: no rising limb on the software curve -->
  <line x1="870" y1="436" x2="870" y2="200" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="4 4"/>
  <circle cx="870" cy="436" r="5" fill="#0f766e"/>
  <rect x="686" y="128" width="286" height="62" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
  <text x="829" y="154" font-size="15.5" fill="#0f766e" text-anchor="middle" font-weight="700">No wear-out phase</text>
  <text x="829" y="176" font-size="13.5" fill="#0f766e" text-anchor="middle">the rising limb never arrives</text>

  <!-- legend -->
  <line x1="120" y1="96" x2="176" y2="96" stroke="#94a3b8" stroke-width="3.5" stroke-dasharray="9 6"/>
  <text x="188" y="102" font-size="15" fill="#334155">Hardware (Fig. 1.5)</text>
  <line x1="120" y1="128" x2="176" y2="128" stroke="#0f766e" stroke-width="4.5"/>
  <text x="188" y="134" font-size="15" fill="#334155">Software (Fig. 1.6)</text>

</svg>
</body>
</html>
