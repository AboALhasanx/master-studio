<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Arial"><rect x="0" y="0" width="680" height="300" fill="#ffffff"/><text x="24" y="30" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1a202c">Quantitative Multidimensional — numeric vector</text><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4a5568"/></marker></defs><line x1="70" y1="250" x2="620" y2="250" stroke="#cbd5e0" stroke-width="1.5"/><line x1="70" y1="250" x2="70" y2="60" stroke="#cbd5e0" stroke-width="1.5"/><text x="560" y="245" text-anchor="start" font-size="11" font-weight="normal" fill="#718096">features →</text><text x="40" y="70" text-anchor="start" font-size="11" font-weight="normal" fill="#718096">value ↑</text><circle cx="120" cy="200" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><circle cx="180" cy="150" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><circle cx="150" cy="120" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><circle cx="240" cy="180" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><circle cx="300" cy="100" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><circle cx="360" cy="160" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><circle cx="280" cy="210" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><circle cx="420" cy="130" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><circle cx="200" cy="90" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><circle cx="470" cy="190" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.5"/><line x1="70" y1="250" x2="300" y2="120" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#ah)"/><text x="150" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">feature vector</text><text x="120" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">Example: Age=25, BP=80, Chol=190, BMI=2