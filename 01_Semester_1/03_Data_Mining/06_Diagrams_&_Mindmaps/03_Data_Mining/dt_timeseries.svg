<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Arial"><rect x="0" y="0" width="680" height="300" fill="#ffffff"/><text x="24" y="30" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1a202c">Time-Series — values across time</text><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4a5568"/></marker></defs><line x1="70" y1="250" x2="620" y2="250" stroke="#cbd5e0" stroke-width="1.5"/><line x1="70" y1="250" x2="70" y2="60" stroke="#cbd5e0" stroke-width="1.5"/><text x="560" y="245" text-anchor="start" font-size="11" font-weight="normal" fill="#718096">time →</text><text x="40" y="70" text-anchor="start" font-size="11" font-weight="normal" fill="#718096">value ↑</text><polyline points="90,210 150,150 210,180 270,110 330,160 390,90 450,200 510,130 570,170" fill="none" stroke="#2b6cb0" stroke-width="2.5"/><circle cx="90" cy="210" r="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="150" cy="150" r="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="210" cy="180" r="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="270" cy="110" r="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="330" cy="160" r="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="390" cy="90" r="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="450" cy="200" r="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="510" cy="130" r="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><circle cx="570" cy="170" r="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><text x="120" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">Example: stock price / ECG signal / temperature</text></svg>