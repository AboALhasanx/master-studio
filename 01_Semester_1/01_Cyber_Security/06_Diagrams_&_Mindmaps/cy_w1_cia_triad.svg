<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 248" font-family="Segoe UI, Arial"><rect x="0" y="0" width="680" height="248" fill="#ffffff"/><text x="24" y="30" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1a202c">The CIA Triad — three pillars + techniques</text><rect x="30" y="60" width="196" height="166" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="2"/><text x="128" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">Confidentiality</text><text x="46" y="126" text-anchor="start" font-size="11.5" font-weight="normal" fill="#1a202c">• encryption</text><text x="46" y="150" text-anchor="start" font-size="11.5" font-weight="normal" fill="#1a202c">• access controls</text><text x="46" y="174" text-anchor="start" font-size="11.5" font-weight="normal" fill="#1a202c">• VPNs</text><rect x="242" y="60" width="196" height="166" rx="10" fill="#f7fafc" stroke="#2f855a" stroke-width="2"/><text x="340" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#2f855a">Integrity</text><text x="258" y="126" text-anchor="start" font-size="11.5" font-weight="normal" fill="#1a202c">• hashing (SHA-256)</text><text x="258" y="150" text-anchor="start" font-size="11.5" font-weight="normal" fill="#1a202c">• digital signatures</text><text x="258" y="174" text-anchor="start" font-size="11.5" font-weight="normal" fill="#1a202c">• version control</text><rect x="454" y="60" width="196" height="166" rx="10" fill="#f7fafc" stroke="#dd6b20" stroke-width="2"/><text x="552" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#dd6b20">Availability</text><text x="470" y="126" text-anchor="start" font-size="11.5" font-weight="normal" fill="#1a202c">• redundancy</text><text x="470" y="150" text-anchor="start" font-size="11.5" font-weight="normal" fill="#1a202c">• load balancing</text><text x="470" y="174" text-anchor="start" font-size="11.5" font-weight="normal" fill="#1a202c">• DDoS mitigation</text></svg>