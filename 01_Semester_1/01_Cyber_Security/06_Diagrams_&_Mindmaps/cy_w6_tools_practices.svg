<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="470" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Web App Security — Tools vs. Practices</text>
  <text x="460" y="54" text-anchor="middle" font-size="13" fill="#6b7280">tools = the technological armory · practices = the human and procedural element</text>

  <!-- TOOLS -->
  <rect x="18" y="74" width="434" height="330" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="18" y="74" width="434" height="36" rx="12" fill="#2563eb"/>
  <rect x="18" y="100" width="434" height="12" fill="#2563eb"/>
  <text x="235" y="99" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">TOOLS — الأدوات</text>

  <text x="38" y="136" font-size="13" font-weight="700" fill="#1e40af">WAF — Web Application Firewall</text>
  <text x="38" y="155" font-size="11.5" fill="#4b5563">application-layer filtering: blocks SQLi / XSS payloads</text>

  <text x="38" y="181" font-size="13" font-weight="700" fill="#1e40af">Vulnerability Scanners</text>
  <text x="38" y="200" font-size="11.5" fill="#4b5563">automated discovery of known weaknesses (SAST/DAST)</text>

  <text x="38" y="226" font-size="13" font-weight="700" fill="#1e40af">RASP — Runtime Application Self-Protection</text>
  <text x="38" y="245" font-size="11.5" fill="#4b5563">sits inside the app and blocks attacks at runtime</text>

  <text x="38" y="271" font-size="13" font-weight="700" fill="#1e40af">Penetration-Testing Platforms</text>
  <text x="38" y="290" font-size="11.5" fill="#4b5563">human + tooling, finds what scanners miss</text>

  <text x="38" y="316" font-size="13" font-weight="700" fill="#1e40af">SIEM + Threat Intelligence</text>
  <text x="38" y="335" font-size="11.5" fill="#4b5563">correlate events, feed known-bad indicators</text>

  <text x="38" y="361" font-size="13" font-weight="700" fill="#1e40af">Emerging Tools</text>
  <text x="38" y="380" font-size="11.5" fill="#4b5563">ML/AI anomaly detection, automated patching</text>

  <!-- PRACTICES -->
  <rect x="468" y="74" width="434" height="330" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="468" y="74" width="434" height="36" rx="12" fill="#16a34a"/>
  <rect x="468" y="100" width="434" height="12" fill="#16a34a"/>
  <text x="685" y="99" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">PRACTICES — الممارسات</text>

  <text x="488" y="136" font-size="13" font-weight="700" fill="#166534">Secure Coding</text>
  <text x="488" y="155" font-size="11.5" fill="#4b5563">input validation · output encoding · parameterized queries</text>

  <text x="488" y="181" font-size="13" font-weight="700" fill="#166534">Authentication &amp; Authorization</text>
  <text x="488" y="200" font-size="11.5" fill="#4b5563">MFA · OAuth/OIDC · session hygiene · least privilege</text>

  <text x="488" y="226" font-size="13" font-weight="700" fill="#166534">Secure Configuration &amp; Hardening</text>
  <text x="488" y="245" font-size="11.5" fill="#4b5563">remove defaults · least services · patched stack</text>

  <text x="488" y="271" font-size="13" font-weight="700" fill="#166534">Continuous Monitoring &amp; IR</text>
  <text x="488" y="290" font-size="11.5" fill="#4b5563">logging · alerting · incident response runbooks</text>

  <text x="488" y="316" font-size="13" font-weight="700" fill="#166534">DevSecOps &amp; Lifecycle</text>
  <text x="488" y="335" font-size="11.5" fill="#4b5563">security in CI/CD, shift-left, SSDLC</text>

  <text x="488" y="365" font-size="12" fill="#6b7280" font-style="italic">«security is not a gate at the end — it is a pipeline»</text>

  <rect x="18" y="418" width="884" height="40" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="460" y="444" text-anchor="middle" font-size="12.5" fill="#374151">A tool without a practice is directionless; a practice without a tool is unenforced — you need both</text>
</svg>
