<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252" font-family="Segoe UI, Arial"><rect x="0" y="0" width="680" height="252" fill="#ffffff"/><text x="24" y="30" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1a202c">Attack Surface — why multiply, not add</text><rect x="40" y="64" width="180" height="66" rx="8" fill="#ebf8ff" stroke="#1a202c" stroke-width="1.5"/><text x="130.0" y="101.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">E — exposed points</text><text x="130" y="118" text-anchor="middle" font-size="11" font-weight="normal" fill="#718096">open ports, APIs</text><text x="232" y="102" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">×</text><rect x="252" y="64" width="180" height="66" rx="8" fill="#ebf8ff" stroke="#1a202c" stroke-width="1.5"/><text x="342.0" y="101.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">V — severity</text><text x="342" y="118" text-anchor="middle" font-size="11" font-weight="normal" fill="#718096">CVSS 0–10</text><text x="444" y="102" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">×</text><rect x="464" y="64" width="176" height="66" rx="8" fill="#ebf8ff" stroke="#1a202c" stroke-width="1.5"/><text x="552.0" y="101.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">A — asset value</text><text x="552" y="118" text-anchor="middle" font-size="11" font-weight="normal" fill="#718096">how important</text><text x="340" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">AS = Σ ( E × V × A )</text><text x="340" y="204" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c53030">any factor = 0  →  AS = 0</text><text x="340" y="228" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#718096">fewer entry points is the cheapest fix</text></svg>