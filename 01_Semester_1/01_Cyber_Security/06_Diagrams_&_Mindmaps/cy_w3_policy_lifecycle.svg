  </defs>
  <rect x="0" y="0" width="920" height="300" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Policy Lifecycle — دورة حياة السياسة الأمنية (5 خطوات)</text>

  <!-- boxes -->
  <g>
