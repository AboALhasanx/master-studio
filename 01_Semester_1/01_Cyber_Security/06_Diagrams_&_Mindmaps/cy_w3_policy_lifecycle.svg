  <!-- loop back -->
  <path d="M 837 168 C 837 236 99 236 99 168" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw2)"/>
  <text x="460" y="258" text-anchor="middle" font-size="12.5" fill="#6b7280">Living document — دورة، مو مرة وحدة (Review &amp; Update تغذّي Draft من جديد)</text>
