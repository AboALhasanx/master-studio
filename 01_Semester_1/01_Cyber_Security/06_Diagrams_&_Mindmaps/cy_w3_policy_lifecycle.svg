  </g>
  <line x1="744" y1="118" x2="770" y2="118" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arw2)"/>

  <g>
    <rect x="772" y="70" width="130" height="96" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="837" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Step 5</text>
