  </g>
  <line x1="180" y1="118" x2="206" y2="118" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arw2)"/>

  <g>
    <rect x="208" y="70" width="158" height="96" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="287" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Step 2</text>
    <text x="287" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4c1d95">Approval</text>
    <text x="287" y="144" text-anchor="middle" font-size="12.5" fill="#4b5563">موافقة</text>
  </g>
  <line x1="368" y1="118" x2="394" y2="118" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arw2)"/>

  <g>
    <rect x="396" y="70" width="158" height="96" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="475" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Step 3</text>
    <text x="475" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Communication</text>
    <text x="475" y="144" text-anchor="middle" font-size="12.5" fill="#4b5563">تواصل/تدريب</text>
  </g>
  <line x1="556" y1="118" x2="582" y2="118" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arw2)"/>

  <g>
