    <text x="663" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Step 4</text>
    <text x="663" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Enforcement</text>
