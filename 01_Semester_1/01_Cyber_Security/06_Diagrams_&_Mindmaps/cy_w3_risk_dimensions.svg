<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="300" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Why Risk Management Is a Strategic Necessity — الأبعاد الثلاثة</text>

  <!-- Financial -->
  <rect x="24" y="62" width="280" height="206" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="70" cy="106" r="22" fill="#dc2626"/>
  <text x="70" y="114" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">$</text>
  <text x="104" y="102" font-size="16" font-weight="700" fill="#991b1b">Financial Risk</text>
  <text x="104" y="124" font-size="14" fill="#7f1d1d">الخسائر المالية</text>
  <line x1="44" y1="142" x2="284" y2="142" stroke="#fca5a5" stroke-width="1"/>
  <text x="44" y="168" font-size="13" fill="#374151">Incident Response Costs</text>
  <text x="44" y="190" font-size="13" fill="#374151">Business Disruption</text>
  <text x="44" y="212" font-size="13" fill="#374151">Legal Penalties · Ransom</text>
  <text x="44" y="234" font-size="13" fill="#374151">Litigation</text>
  <text x="44" y="256" font-size="12.5" font-style="italic" fill="#991b1b">EFL = Σ Pᵢ · Iᵢ</text>

  <!-- Operational -->
  <rect x="320" y="62" width="280" height="206" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="366" cy="106" r="22" fill="#d97706"/>
  <text x="366" y="114" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">⚙</text>
  <text x="400" y="102" font-size="16" font-weight="700" fill="#92400e">Operational Risk</text>
  <text x="400" y="124" font-size="14" fill="#78350f">المخاطر التشغيلية</text>
  <line x1="340" y1="142" x2="580" y2="142" stroke="#fcd34d" stroke-width="1"/>
  <text x="340" y="168" font-size="13" fill="#374151">Operational paralysis</text>
  <text x="340" y="190" font-size="13" fill="#374151">Business continuity</text>
  <text x="340" y="212" font-size="13" fill="#374151">Backups · Redundancy</text>
  <text x="340" y="234" font-size="13" fill="#374151">Incident response plan</text>
  <text x="340" y="256" font-size="12.5" font-style="italic" fill="#92400e">"keep working under attack"</text>

  <!-- Reputational -->
  <rect x="616" y="62" width="280" height="206" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="662" cy="106" r="22" fill="#4f46e5"/>
  <text x="662" y="114" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">★</text>
  <text x="696" y="102" font-size="16" font-weight="700" fill="#3730a3">Reputational Risk</text>
  <text x="696" y="124" font-size="14" fill="#312e81">مخاطر السمعة</text>
  <line x1="636" y1="142" x2="876" y2="142" stroke="#a5b4fc" stroke-width="1"/>
  <text x="636" y="168" font-size="13" fill="#374151">Trust = the top asset</text>
  <text x="636" y="190" font-size="13" fill="#374151">Customer confidence</text>
  <text x="636" y="212" font-size="13" fill="#374151">Banks · Healthcare ·</text>
  <text x="636" y="234" font-size="13" fill="#374151">e-commerce</text>
  <text x="636" y="256" font-size="12.5" font-style="italic" fill="#3730a3">"once lost, hard to restore"</text>
</svg>
