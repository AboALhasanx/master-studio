<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="440" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Reliability &amp; Business Continuity — الصمود واستمرارية العمل</text>
  <text x="460" y="54" text-anchor="middle" font-size="13" fill="#6b7280">reliability = keep the service trustworthy · continuity = keep operating under disruption</text>

  <!-- foundations -->
  <rect x="18" y="74" width="288" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="162" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">Foundations</text>
  <text x="38" y="128" font-size="12.5" font-weight="700" fill="#1e3a8a">Reliability</text>
  <text x="38" y="148" font-size="11.5" fill="#374151">probability the app performs its</text>
  <text x="38" y="164" font-size="11.5" fill="#374151">function under stated conditions</text>
  <text x="38" y="190" font-size="12.5" font-weight="700" fill="#1e3a8a">Business Continuity</text>
  <text x="38" y="210" font-size="11.5" fill="#374151">sustained operations during</text>
  <text x="38" y="226" font-size="11.5" fill="#374151">attacks, failures, disasters</text>
  <text x="38" y="248" font-size="11" fill="#6b7280">the two domains are inseparable</text>

  <!-- mechanisms -->
  <rect x="316" y="74" width="288" height="180" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">Mechanisms</text>
  <text x="336" y="128" font-size="12.5" fill="#374151">Redundancy — servers, zones, links</text>
  <text x="336" y="150" font-size="12.5" fill="#374151">Failover &amp; load balancing</text>
  <text x="336" y="172" font-size="12.5" fill="#374151">Backups (immutable, tested)</text>
  <text x="336" y="194" font-size="12.5" fill="#374151">DRP — Disaster Recovery Plan</text>
  <text x="336" y="216" font-size="12.5" fill="#374151">IR integration — the two plans meet</text>
  <text x="336" y="240" font-size="11.5" fill="#6b7280">+ regulatory alignment (GDPR, HIPAA…)</text>

  <!-- threats -->
  <rect x="614" y="74" width="288" height="180" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="758" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991b1b">Threats to continuity</text>
  <text x="634" y="128" font-size="12.5" fill="#374151">DDoS — flood the service</text>
  <text x="634" y="150" font-size="12.5" fill="#374151">Ransomware — encrypt &amp; extort</text>
  <text x="634" y="172" font-size="12.5" fill="#374151">Insider threats — trusted access</text>
  <text x="634" y="194" font-size="12.5" fill="#374151">Supply-chain compromise</text>
  <text x="634" y="220" font-size="11.5" fill="#6b7280">these hit uptime, not just data</text>

  <!-- math -->
  <rect x="18" y="270" width="884" height="86" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="460" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">The maths of continuity</text>
  <text x="460" y="318" text-anchor="middle" font-size="12.5" fill="#334155">Availability  A = MTBF / (MTBF + MTTR)      ·      Continuity Index (weighted uptime + recovery)</text>
  <text x="460" y="340" text-anchor="middle" font-size="12.5" fill="#334155">Reliability over time  R(t) = e^(−λt)      ·      P(failure due to cyber events) from the threat model</text>

  <!-- key numbers -->
  <rect x="18" y="368" width="884" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">The two numbers examiners love</text>
  <text x="460" y="414" text-anchor="middle" font-size="12.5" fill="#78350f">RTO — Recovery Time Objective (how long can we be down?)   ·   RPO — Recovery Point Objective (how much data can we lose?)</text>
</svg>
