<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" font-family="Segoe UI, Arial"><rect x="0" y="0" width="680" height="262" fill="#ffffff"/><text x="24" y="30" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1a202c">Risk chain + the two equations</text><rect x="40" y="64" width="180" height="58" rx="8" fill="#ebf8ff" stroke="#1a202c" stroke-width="1.6"/><text x="130.0" y="97.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Threat (F)</text><line x1="222" y1="93" x2="250" y2="93" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><rect x="252" y="64" width="176" height="58" rx="8" fill="#ebf8ff" stroke="#1a202c" stroke-width="1.6"/><text x="340.0" y="97.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Vulnerability</text><line x1="430" y1="93" x2="458" y2="93" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><rect x="460" y="64" width="180" height="58" rx="8" fill="#f7fafc" stroke="#c53030" stroke-width="1.6"/><text x="550.0" y="97.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">Damage</text><text x="340" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Basic risk   S = F × K</text><text x="340" y="182" text-anchor="middle" font-size="11" font-weight="normal" fill="#718096">(F = frequency of attempts, K = consequences)</text><text x="340" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Residual risk   R = S / M</text><text x="340" y="238" text-anchor="middle" font-size="11" font-weight="normal" fill="#718096">(M = number of countermeasures × effectiveness)</text></svg>