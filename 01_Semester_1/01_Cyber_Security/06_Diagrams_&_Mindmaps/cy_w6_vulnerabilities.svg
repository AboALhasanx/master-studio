<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="470" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Web Vulnerabilities — الثغرات الكلاسيكية والحديثة</text>
  <text x="460" y="54" text-anchor="middle" font-size="13" fill="#6b7280">from monolithic SQLi to API and supply-chain exploitation</text>

  <!-- row 1 -->
  <rect x="18" y="74" width="288" height="176" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="162" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991b1b">SQL Injection (SQLi)</text>
  <text x="38" y="126" font-size="12" fill="#374151">input concatenated into a query</text>
  <text x="38" y="146" font-size="12" fill="#374151">→ attacker changes the query logic</text>
  <text x="38" y="172" font-size="12" font-weight="700" fill="#166534">Defense</text>
  <text x="38" y="192" font-size="11.5" fill="#4b5563">parameterized queries / prepared</text>
  <text x="38" y="208" font-size="11.5" fill="#4b5563">statements · input validation · WAF</text>
  <text x="38" y="234" font-size="11" fill="#9ca3af">classic — monolithic era</text>

  <rect x="316" y="74" width="288" height="176" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="460" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991b1b">Cross-Site Scripting (XSS)</text>
  <text x="336" y="126" font-size="12" fill="#374151">untrusted data rendered as code</text>
  <text x="336" y="146" font-size="12" fill="#374151">→ script runs in the victim's browser</text>
  <text x="336" y="172" font-size="12" font-weight="700" fill="#166534">Defense</text>
  <text x="336" y="192" font-size="11.5" fill="#4b5563">output encoding · CSP · HttpOnly</text>
  <text x="336" y="208" font-size="11.5" fill="#4b5563">cookies · sanitize rich input</text>
  <text x="336" y="234" font-size="11" fill="#9ca3af">stored · reflected · DOM-based</text>

  <rect x="614" y="74" width="288" height="176" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="758" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991b1b">CSRF</text>
  <text x="634" y="126" font-size="12" fill="#374151">victim's browser sends an</text>
  <text x="634" y="146" font-size="12" fill="#374151">authenticated request unknowingly</text>
  <text x="634" y="172" font-size="12" font-weight="700" fill="#166534">Defense</text>
  <text x="634" y="192" font-size="11.5" fill="#4b5563">anti-CSRF tokens · SameSite cookies</text>
  <text x="634" y="208" font-size="11.5" fill="#4b5563">re-auth for sensitive actions</text>
  <text x="634" y="234" font-size="11" fill="#9ca3af">Cross-Site Request Forgery</text>

  <!-- row 2 -->
  <rect x="18" y="266" width="288" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="162" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">API &amp; Microservices</text>
  <text x="38" y="318" font-size="12" fill="#374151">broken object-level authorization</text>
  <text x="38" y="338" font-size="12" fill="#374151">excessive data exposure</text>
  <text x="38" y="358" font-size="12" fill="#374151">token / JWT misuse</text>
  <text x="38" y="384" font-size="11.5" font-weight="700" fill="#166534">→ API security governance + schema validation</text>
  <text x="38" y="404" font-size="11" fill="#9ca3af">the modern attack surface</text>

  <rect x="316" y="266" width="288" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="460" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Supply Chain</text>
  <text x="336" y="318" font-size="12" fill="#374151">a trusted dependency is compromised</text>
  <text x="336" y="338" font-size="12" fill="#374151">third-party scripts / build pipeline</text>
  <text x="336" y="358" font-size="12" fill="#374151">SBOM blind spots</text>
  <text x="336" y="384" font-size="11.5" font-weight="700" fill="#166534">→ SBOM + pinning + provenance</text>
  <text x="336" y="404" font-size="11" fill="#9ca3af">SolarWinds-style reach</text>

  <rect x="614" y="266" width="288" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="758" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Cloud-Native &amp; Serverless</text>
  <text x="634" y="318" font-size="12" fill="#374151">misconfigured storage / IAM</text>
  <text x="634" y="338" font-size="12" fill="#374151">container &amp; orchestration flaws</text>
  <text x="634" y="358" font-size="12" fill="#374151">over-permissive function roles</text>
  <text x="634" y="384" font-size="11.5" font-weight="700" fill="#166534">→ least privilege + config hardening</text>
  <text x="634" y="404" font-size="11" fill="#9ca3af">serverless = shared responsibility</text>

  <rect x="18" y="430" width="884" height="32" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="460" y="451" text-anchor="middle" font-size="12.5" fill="#374151">Common root cause: <tspan font-weight="700">untrusted input reaching a sensitive sink</tspan> — validation, encoding and authorization break the chain</text>
</svg>
