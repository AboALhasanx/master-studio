<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="330" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Three Transitions in Cryptography — الانتقالات الثلاثة</text>
  <text x="460" y="54" text-anchor="middle" font-size="13" fill="#6b7280">an arms race between code-makers and code-breakers</text>

  <!-- card 1 -->
  <rect x="18" y="72" width="272" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="154" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">1 · Classical secrecy</text>
  <text x="154" y="122" text-anchor="middle" font-size="12.5" fill="#4b5563">broken by</text>
  <text x="154" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">statistical cryptanalysis</text>
  <text x="154" y="170" text-anchor="middle" font-size="11.5" fill="#6b7280">frequency analysis topples</text>
  <text x="154" y="187" text-anchor="middle" font-size="11.5" fill="#6b7280">substitution ciphers</text>
  <text x="154" y="210" text-anchor="middle" font-size="11" fill="#9ca3af">Caesar · Vigenère</text>

  <!-- card 2 -->
  <rect x="324" y="72" width="272" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="460" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">2 · Mechanical complexity</text>
  <text x="460" y="122" text-anchor="middle" font-size="12.5" fill="#4b5563">broken by</text>
  <text x="460" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">operational cryptanalysis</text>
  <text x="460" y="170" text-anchor="middle" font-size="11.5" fill="#6b7280">procedure · capture ·</text>
  <text x="460" y="187" text-anchor="middle" font-size="11.5" fill="#6b7280">clever automation</text>
  <text x="460" y="210" text-anchor="middle" font-size="11" fill="#9ca3af">Enigma</text>

  <!-- card 3 -->
  <rect x="630" y="72" width="272" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="766" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">3 · Mathematical hardness</text>
  <text x="766" y="122" text-anchor="middle" font-size="12.5" fill="#4b5563">broken by</text>
  <text x="766" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">computational cryptanalysis</text>
  <text x="766" y="170" text-anchor="middle" font-size="11.5" fill="#6b7280">until computing, math or</text>
  <text x="766" y="187" text-anchor="middle" font-size="11.5" fill="#6b7280">implementation slip</text>
  <text x="766" y="210" text-anchor="middle" font-size="11" fill="#9ca3af">RSA · ECC · AES</text>

  <line x1="292" y1="147" x2="320" y2="147" stroke="#b45309" stroke-width="2.5" marker-end="url(#t-arw)"/>
  <line x1="598" y1="147" x2="626" y2="147" stroke="#b45309" stroke-width="2.5" marker-end="url(#t-arw)"/>

  <!-- lesson banner -->
  <rect x="18" y="240" width="884" height="72" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="266" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">Lesson: Security = math × implementation × operations</text>
  <text x="460" y="288" text-anchor="middle" font-size="12.5" fill="#78350f">Keys (their entropy and handling) matter more than algorithms · "Unbreakable" is always contextual</text>
</svg>
