<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="d-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="400" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Naming Security — DNS → DNSSEC → DoT / DoH</text>
  <text x="460" y="54" text-anchor="middle" font-size="13" fill="#6b7280">three separate problems: integrity of answers, privacy of the query</text>

  <!-- 1 classic DNS -->
  <rect x="18" y="74" width="272" height="168" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="154" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991b1b">1 · Classic DNS</text>
  <text x="38" y="126" font-size="12.5" fill="#374151">Unsigned, unauthenticated answers</text>
  <text x="38" y="148" font-size="12.5" fill="#374151">Plaintext over port 53</text>
  <text x="38" y="174" font-size="13" font-weight="700" fill="#b91c1c">Weakness</text>
  <text x="38" y="196" font-size="12.5" fill="#374151">Cache poisoning (Kaminsky, 2008)</text>
  <text x="38" y="218" font-size="12.5" fill="#374151">Off-path spoofed responses</text>

  <!-- 2 DNSSEC -->
  <rect x="316" y="74" width="272" height="168" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="452" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f766e">2 · DNSSEC</text>
  <text x="336" y="126" font-size="12.5" fill="#374151">Signed answers, chain of trust</text>
  <text x="336" y="148" font-size="12.5" fill="#374151">from the root down to the zone</text>
  <text x="336" y="174" font-size="13" font-weight="700" fill="#0f766e">Gives</text>
  <text x="336" y="196" font-size="12.5" fill="#374151">Integrity + authenticity of records</text>
  <text x="336" y="218" font-size="12.5" fill="#374151">RFC 4033 / 4035</text>

  <!-- 3 DoT/DoH -->
  <rect x="614" y="74" width="288" height="168" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="758" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">3 · DoT / DoH</text>
  <text x="634" y="126" font-size="12.5" fill="#374151">Encrypt the resolver channel itself</text>
  <text x="634" y="148" font-size="12.5" fill="#374151">DNS-over-TLS (RFC 7858)</text>
  <text x="634" y="170" font-size="12.5" fill="#374151">DNS-over-HTTPS (RFC 8484)</text>
  <text x="634" y="196" font-size="13" font-weight="700" fill="#1e40af">Gives</text>
  <text x="634" y="218" font-size="12.5" fill="#374151">Privacy from on-path observers</text>

  <line x1="292" y1="158" x2="312" y2="158" stroke="#0d9488" stroke-width="2.5" marker-end="url(#d-arw)"/>
  <line x1="590" y1="158" x2="610" y2="158" stroke="#0d9488" stroke-width="2.5" marker-end="url(#d-arw)"/>

  <rect x="18" y="262" width="884" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="288" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">Key distinction</text>
  <text x="460" y="310" text-anchor="middle" font-size="12.5" fill="#78350f">DNSSEC fixes <tspan font-weight="700">integrity</tspan> (is the answer genuine?) — DoT/DoH fix <tspan font-weight="700">privacy</tspan> (who can see the question?). They are complementary, not alternatives.</text>

  <rect x="18" y="336" width="884" height="50" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="460" y="358" text-anchor="middle" font-size="12.5" fill="#374151">Related naming/routing trust:  RPKI (RFC 6480) validates BGP <tspan font-weight="700">origin</tspan> · BGPsec (RFC 8205) validates the <tspan font-weight="700">path</tspan></text>
  <text x="460" y="377" text-anchor="middle" font-size="12" fill="#6b7280">Ingress filtering (BCP 38 / RFC 2827) blocks source spoofing at provider edges</text>
</svg>
