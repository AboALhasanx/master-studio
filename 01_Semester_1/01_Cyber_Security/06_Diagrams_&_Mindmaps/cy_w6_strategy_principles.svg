<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="400" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Core Strategic Principles — المبادئ الاستراتيجية الأربعة</text>
  <text x="460" y="54" text-anchor="middle" font-size="13" fill="#6b7280">strategy ≠ tactics: sustained frameworks, not isolated patches</text>

  <!-- 1 -->
  <rect x="18" y="74" width="424" height="136" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">1 · Defense-in-Depth</text>
  <text x="38" y="128" font-size="12.5" fill="#374151">طبقات متراكبة — ما تعتمد على ضابط واحد</text>
  <text x="38" y="150" font-size="12.5" fill="#374151">كل طبقة تفترض إن اللي قبلها انكسرت</text>
  <text x="38" y="176" font-size="12.5" fill="#374151">Residual risk = ∏ (1 − eᵢ)</text>
  <text x="38" y="198" font-size="11.5" fill="#6b7280">layers must be independent to multiply</text>

  <!-- 2 -->
  <rect x="462" y="74" width="440" height="136" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="682" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">2 · Zero Trust</text>
  <text x="482" y="128" font-size="12.5" fill="#374151">«Never Trust, Always Verify»</text>
  <text x="482" y="150" font-size="12.5" fill="#374151">الداخل مو موثوق تلقائياً — كل طلب يُصادق</text>
  <text x="482" y="176" font-size="12.5" fill="#374151">Least privilege ديناميكي + تحقّق مستمر</text>
  <text x="482" y="198" font-size="11.5" fill="#6b7280">kills the «inside = trusted» perimeter assumption</text>

  <!-- 3 -->
  <rect x="18" y="226" width="424" height="136" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">3 · Security by Design</text>
  <text x="38" y="280" font-size="12.5" fill="#374151">الأمن من مرحلة التصميم، مو يُضاف لاحقاً</text>
  <text x="38" y="302" font-size="12.5" fill="#374151">Threat modelling قبل الكود</text>
  <text x="38" y="328" font-size="12.5" fill="#374151">Secure defaults + least privilege بالتصميم</text>
  <text x="38" y="350" font-size="11.5" fill="#6b7280">cheapest place to fix a flaw is the design stage</text>

  <!-- 4 -->
  <rect x="462" y="226" width="440" height="136" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="682" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">4 · Risk-Based Prioritization</text>
  <text x="482" y="280" font-size="12.5" fill="#374151">الموارد محدودة ← نرتّب حسب الخطر</text>
  <text x="482" y="302" font-size="12.5" fill="#374151">Risk = Likelihood × Impact (مع الأصول)</text>
  <text x="482" y="328" font-size="12.5" fill="#374151">ما نصرف على تهديد واطي الأثر</text>
  <text x="482" y="350" font-size="11.5" fill="#6b7280">CVSS + business context + exploitability</text>
</svg>
