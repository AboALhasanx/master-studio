<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 244" font-family="Segoe UI, Arial"><rect x="0" y="0" width="680" height="244" fill="#ffffff"/><text x="24" y="30" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#1a202c">Four authentication factors</text><rect x="40" y="64" width="290" height="58" rx="8" fill="#ebf8ff" stroke="#1a202c" stroke-width="1.6"/><text x="185.0" y="97.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Knowledge — something you know</text><rect x="350" y="64" width="290" height="58" rx="8" fill="#ebf8ff" stroke="#1a202c" stroke-width="1.6"/><text x="495.0" y="97.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Possession — something you have</text><rect x="40" y="140" width="290" height="58" rx="8" fill="#ebf8ff" stroke="#1a202c" stroke-width="1.6"/><text x="185.0" y="173.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Inherence — something you are</text><rect x="350" y="140" width="290" height="58" rx="8" fill="#ebf8ff" stroke="#1a202c" stroke-width="1.6"/><text x="495.0" y="173.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Location — somewhere you are</text><text x="340" y="224" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#718096">authorization is based on authentication</text></svg>