<text x="540" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">Agile, XP and Scrum: Changing the Philosophy</text>
<text x="540" y="74" text-anchor="middle" font-size="16" fill="#64748b">Small increments every two to three weeks &#183; people over process &#183; and the two named methods that carry it (Sommerville &#167;3.1; Mall &#167;2.4)</text>
<line x1="30" y1="98" x2="1050" y2="98" stroke="#e2e8f0" stroke-width="1.5"/>

<text x="30" y="126" font-size="13.5" font-weight="700" fill="#0e7490" letter-spacing="1.1">THE AGILE MANIFESTO &#8212; THE CANONICAL FOUR (SOMMERVILLE p.76)</text>
<rect x="30" y="142" width="510" height="42" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.3"/>
<text x="44" y="169" font-size="13" font-weight="700" fill="#075985">Individuals and interactions</text>
<text x="300" y="169" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">over</text>
<text x="324" y="169" font-size="12" fill="#94a3b8">processes and tools</text>
<rect x="30" y="190" width="510" height="42" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.3"/>
<text x="44" y="217" font-size="13" font-weight="700" fill="#075985">Working software</text>
<text x="300" y="217" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">over</text>
<text x="324" y="217" font-size="12" fill="#94a3b8">comprehensive documentation</text>
<rect x="30" y="238" width="510" height="42" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.3"/>
<text x="44" y="265" font-size="13" font-weight="700" fill="#075985">Customer collaboration</text>
<text x="300" y="265" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">over</text>
<text x="324" y="265" font-size="12" fill="#94a3b8">contract negotiation</text>
<rect x="30" y="286" width="510" height="42" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.3"/>
<text x="44" y="313" font-size="13" font-weight="700" fill="#075985">Responding to change</text>
<text x="300" y="313" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">over</text>
<text x="324" y="313" font-size="12" fill="#94a3b8">following a plan</text>
<text x="30" y="356" font-size="11.5" font-style="italic" fill="#64748b">&#8220;While there is value in the items on the right, we value the items on the left more.&#8221;</text>

<text x="560" y="126" font-size="13.5" font-weight="700" fill="#c2410c" letter-spacing="1.1">EXTREME PROGRAMMING &#8212; TAKEN TO THE EXTREME (Mall p.111)</text>
<rect x="560" y="142" width="156" height="72" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/><text x="570" y="163" font-size="11.5" font-weight="700" fill="#c2410c">Code review</text><text x="570" y="182" font-size="10" fill="#57534e">pair programming:</text><text x="570" y="197" font-size="10" fill="#57534e">one writes, one reviews</text>
<rect x="727" y="142" width="156" height="72" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/><text x="737" y="163" font-size="11.5" font-weight="700" fill="#c2410c">Testing</text><text x="737" y="182" font-size="10" fill="#57534e">test-driven development:</text><text x="737" y="197" font-size="10" fill="#57534e">tests written before code</text>
<rect x="894" y="142" width="156" height="72" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/><text x="904" y="163" font-size="11.5" font-weight="700" fill="#c2410c">Incremental dev.</text><text x="904" y="182" font-size="10" fill="#57534e">a new increment every</text><text x="904" y="197" font-size="10" fill="#57534e">few days</text>
<rect x="560" y="226" width="156" height="72" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/><text x="570" y="247" font-size="11.5" font-weight="700" fill="#c2410c">Simplicity</text><text x="570" y="266" font-size="10" fill="#57534e">simplest code that works;</text><text x="570" y="281" font-size="10" fill="#57534e">refine by refactoring</text>
<rect x="727" y="226" width="156" height="72" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/><text x="737" y="247" font-size="11.5" font-weight="700" fill="#c2410c">Design</text><text x="737" y="266" font-size="10" fill="#57534e">everybody designs daily,</text><text x="737" y="281" font-size="10" fill="#57534e">through refactoring</text>
<rect x="894" y="226" width="156" height="72" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/><text x="904" y="247" font-size="11.5" font-weight="700" fill="#c2410c">Integration testing</text><text x="904" y="266" font-size="10" fill="#57534e">continuous integration,</text><text x="904" y="281" font-size="10" fill="#57534e">several times a day</text>
<rect x="560" y="312" width="156" height="66" rx="9" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.4"/><text x="570" y="333" font-size="11.5" font-weight="700" fill="#6d28d9">User story</text><text x="570" y="352" font-size="10" fill="#57534e">like a use case but</text><text x="570" y="367" font-size="10" fill="#57534e">informal and simpler</text>
<rect x="727" y="312" width="156" height="66" rx="9" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.4"/><text x="737" y="333" font-size="11.5" font-weight="700" fill="#6d28d9">Metaphor</text><text x="737" y="352" font-size="10" fill="#57534e">a shared vision of</text><text x="737" y="367" font-size="10" fill="#57534e">how the system works</text>
<rect x="894" y="312" width="156" height="66" rx="9" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.4"/><text x="904" y="333" font-size="11.5" font-weight="700" fill="#6d28d9">Spike</text><text x="904" y="352" font-size="10" fill="#57534e">a tiny program to test</text><text x="904" y="367" font-size="10" fill="#57534e">a proposed solution</text>

<line x1="30" y1="394" x2="1050" y2="394" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="30" y="406" font-size="13.5" font-weight="700" fill="#047857" letter-spacing="1.1">SCRUM &#8212; SPRINTS AND THE THREE ROLES (Mall p.114)</text>
<rect x="30" y="414" width="186" height="58" rx="9" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="123" y="449" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Product backlog</text>
<path d="M 220 443 L 230 443" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="234" y="414" width="186" height="58" rx="9" fill="#dcfce7" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="327" y="449" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Sprint planning</text>

<rect x="438" y="414" width="186" height="58" rx="9" fill="#dcfce7" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="531" y="449" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Sprint (&#8776; 2 weeks)</text>
<path d="M 628 443 L 638 443" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="642" y="414" width="186" height="58" rx="9" fill="#dcfce7" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="735" y="449" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Increment delivered</text>
<path d="M 832 443 L 842 443" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="846" y="414" width="186" height="58" rx="9" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="939" y="449" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Sprint review</text>
<path d="M 963 480 L 963 500 L 123 500 L 123 480" fill="none" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arO)"/>
<text x="543" y="516" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2410c">every sprint ends in a review where the customer re-evaluates the requirements</text>
<rect x="30" y="530" width="330" height="46" rx="9" fill="#fff" stroke="#0369a1" stroke-width="1.4"/><text x="42" y="550" font-size="11.5" font-weight="700" fill="#0369a1">Software owner</text><text x="42" y="567" font-size="10.5" fill="#57534e">communicates the customer&#8217;s vision to the team</text>
<rect x="371" y="530" width="330" height="46" rx="9" fill="#fff" stroke="#6d28d9" stroke-width="1.4"/><text x="383" y="550" font-size="11.5" font-weight="700" fill="#6d28d9">Scrum master</text><text x="383" y="567" font-size="10.5" fill="#57534e">liaison between the owner and the team; facilitates the work</text>
<rect x="712" y="530" width="330" height="46" rx="9" fill="#fff" stroke="#047857" stroke-width="1.4"/><text x="724" y="550" font-size="11.5" font-weight="700" fill="#047857">Team member</text><text x="724" y="567" font-size="10.5" fill="#57534e">does the development work</text>

<line x1="30" y1="592" x2="1050" y2="592" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="30" y="606" width="500" height="86" rx="10" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="46" y="630" font-size="13" font-weight="700" fill="#047857">&#10003; Agile / XP fits</text>
<text x="46" y="652" font-size="12" fill="#475569">Small teams (5&#8211;9) &#183; new technology or research projects where</text>
<text x="46" y="670" font-size="12" fill="#475569">requirements move fast &#183; a customer representative inside the team.</text>
<rect x="550" y="606" width="500" height="86" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="566" y="630" font-size="13" font-weight="700" fill="#b91c1c">&#10007; Agile / XP does not fit</text>
<text x="566" y="652" font-size="12" fill="#475569"><tspan font-weight="700">Stable requirements</tspan> &#8594; iterative waterfall is better &#183;</text>
<text x="566" y="670" font-size="12" fill="#475569"><tspan font-weight="700">mission- or safety-critical systems</tspan> &#8594; traditional SDLC.</text>

<line x1="30" y1="712" x2="1050" y2="712" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
