<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff} #diagram{width:1080px;background:#fff}
text{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,Arial,Helvetica,sans-serif}
</style></head><body><div id="diagram">
<svg width="1080" height="820" viewBox="0 0 1080 820" xmlns="http://www.w3.org/2000/svg">
<text x="540" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">Choosing a Model: No Winner, Only Fit</text>
<text x="540" y="74" text-anchor="middle" font-size="16" fill="#64748b">Three factors decide &#183; two drivers dominate &#183; and the documentation always ends up reading like waterfall (Mall &#167;2.6, pp.118&#8211;121)</text>
<line x1="30" y1="98" x2="1050" y2="98" stroke="#e2e8f0" stroke-width="1.5"/>

<text x="30" y="126" font-size="14" font-weight="700" fill="#1e3a8a" letter-spacing="1.2">THE THREE FACTORS THAT INFLUENCE SELECTION (MALL p.120)</text>
<rect x="30" y="140" width="330" height="152" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="44" y="164" font-size="13.5" font-weight="700" fill="#1e40af">1 &#183; The product</text>
<text x="44" y="188" font-size="11.5" fill="#334155">&#8226; How well are the requirements understood?</text>
<text x="44" y="212" font-size="11.5" fill="#334155">&#8226; How stable are they likely to stay?</text>
<text x="44" y="236" font-size="11.5" fill="#334155">&#8226; How large and how complex is the system?</text>
<text x="44" y="260" font-size="11.5" fill="#334155">&#8226; What is the quality and reliability demand?</text>
<rect x="371" y="140" width="330" height="152" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="385" y="164" font-size="13.5" font-weight="700" fill="#6d28d9">2 &#183; The development team</text>
<text x="385" y="188" font-size="11.5" fill="#334155">&#8226; Size &#8212; small teams suit agile, large teams need structure</text>
<text x="385" y="212" font-size="11.5" fill="#334155">&#8226; Experience and skill level of the members</text>
<text x="385" y="236" font-size="11.5" fill="#334155">&#8226; How geographically distributed is the team?</text>
<text x="385" y="260" font-size="11.5" fill="#334155">&#8226; How familiar are they with the technology?</text>
<rect x="712" y="140" width="330" height="152" rx="10" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="726" y="164" font-size="13.5" font-weight="700" fill="#047857">3 &#183; The customer</text>
<text x="726" y="188" font-size="11.5" fill="#334155">&#8226; Can they take part actively and continuously?</text>
<text x="726" y="212" font-size="11.5" fill="#334155">&#8226; Can a representative sit inside the team?</text>
<text x="726" y="236" font-size="11.5" fill="#334155">&#8226; Will they accept an incremental or evolving system?</text>
<text x="726" y="260" font-size="11.5" fill="#334155">&#8226; Are they contracting formally, or collaborating?</text>

<line x1="30" y1="314" x2="1050" y2="314" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="30" y="336" font-size="14" font-weight="700" fill="#1e3a8a" letter-spacing="1.2">THE SELECTION GUIDE &#8212; WHICH SITUATION CALLS FOR WHICH MODEL</text>
<text x="44" y="344" font-size="11" font-weight="700" fill="#64748b">SITUATION</text>
<text x="366" y="344" font-size="11" font-weight="700" fill="#64748b">MODEL</text>
<text x="606" y="344" font-size="11" font-weight="700" fill="#64748b">WHY IT FITS</text>
<rect x="30" y="348" width="1020" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="370" font-size="11.5" fill="#334155">Requirements fully stable, low risk</text>
<text x="366" y="370" font-size="11.5" font-weight="700" fill="#1e40af">Classical / iterative waterfall</text>
<text x="606" y="370" font-size="11.5" fill="#64748b">Nothing will change, so freeze everything up front</text>
<rect x="30" y="384" width="1020" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="406" font-size="11.5" fill="#334155">Requirements unclear, risk identifiable</text>
<text x="366" y="406" font-size="11.5" font-weight="700" fill="#1e40af">Prototyping</text>
<text x="606" y="406" font-size="11.5" fill="#64748b">Build something to discover what is actually wanted</text>
<rect x="30" y="420" width="1020" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="442" font-size="11.5" fill="#334155">Requirements keep changing in the field</text>
<text x="366" y="442" font-size="11.5" font-weight="700" fill="#1e40af">Evolutionary / Incremental</text>
<text x="606" y="442" font-size="11.5" fill="#64748b">Let the system itself absorb the change</text>
<rect x="30" y="456" width="1020" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="478" font-size="11.5" fill="#334155">Large project, requirements well understood</text>
<text x="366" y="478" font-size="11.5" font-weight="700" fill="#1e40af">Incremental</text>
<text x="606" y="478" font-size="11.5" fill="#64748b">Deliver in slices; the size rules out a single build</text>
<rect x="30" y="492" width="1020" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="514" font-size="11.5" fill="#334155">Schedule is the binding constraint</text>
<text x="366" y="514" font-size="11.5" font-weight="700" fill="#1e40af">RAD</text>
<text x="606" y="514" font-size="11.5" fill="#64748b">Parallel feature teams, component reuse, time-box</text>
<rect x="30" y="528" width="1020" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="550" font-size="11.5" fill="#334155">Risk is the dominant factor, large scale</text>
<text x="366" y="550" font-size="11.5" font-weight="700" fill="#1e40af">Spiral</text>
<text x="606" y="550" font-size="11.5" fill="#64748b">Risk becomes the control variable of the project</text>
<rect x="30" y="564" width="1020" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="586" font-size="11.5" fill="#334155">Object-oriented, need one adoptable framework</text>
<text x="366" y="586" font-size="11.5" font-weight="700" fill="#1e40af">Unified Process</text>
<text x="606" y="586" font-size="11.5" fill="#64748b">Phases &#215; workflows, deployment treated as part of the process</text>
<rect x="30" y="600" width="1020" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="622" font-size="11.5" fill="#334155">Small team, requirements move fast</text>
<text x="366" y="622" font-size="11.5" font-weight="700" fill="#1e40af">Agile / XP / Scrum</text>
<text x="606" y="622" font-size="11.5" fill="#64748b">Two-to-three-week increments, customer inside the team</text>
<rect x="30" y="636" width="1020" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="658" font-size="11.5" fill="#334155">Mission- or safety-critical system</text>
<text x="366" y="658" font-size="11.5" font-weight="700" fill="#1e40af">A very structured process</text>
<text x="606" y="658" font-size="11.5" fill="#64748b">Reliability first: plan-driven beats flexible (Sommerville p.46)</text>

<line x1="30" y1="686" x2="1050" y2="686" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="30" y="700" width="1020" height="72" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="46" y="724" font-size="13.5" font-weight="700" fill="#92400e">&#9888; THE TRAP THAT CATCHES EVERYONE &#8212; why the final documentation reads like waterfall</text>
<text x="46" y="746" font-size="12" fill="#78350f">Even when a project is built incrementally, iteratively or agilely, the <tspan font-weight="700">final documentation is written as if the classical waterfall had been used</tspan>.</text>
<text x="46" y="764" font-size="12" fill="#78350f">The reason: the customer and the maintainer need a <tspan font-weight="700">linear, readable account</tspan> of what the system is &#8212; not the actual order in which it was discovered. (Mall p.121)</text>

<line x1="30" y1="792" x2="1050" y2="792" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
<text x="30" y="812" font-size="12.5" fill="#64748b"><tspan font-weight="700" fill="#334155">Sources:</tspan> Mall, Fundamentals of Software Engineering (4th ed.), &#167;2.6&#8211;&#167;2.6.1, pp.118&#8211;121 &#183; Sommerville, Software Engineering (9th ed.), p.46.</text>
</svg></div></body></html>
