<text x="540" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">The Master Comparison: Eleven Models, One Argument</text>
<text x="540" y="74" text-anchor="middle" font-size="16" fill="#64748b">Requirements always change &#183; every model is an answer to that one problem &#183; the models differ only in when and how they absorb it</text>
<line x1="30" y1="98" x2="1050" y2="98" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="152" font-size="11" font-weight="700" fill="#64748b">Model</text>
<text x="240" y="152" font-size="11" font-weight="700" fill="#64748b">Requirements fixed up front?</text>
<text x="400" y="152" font-size="11" font-weight="700" fill="#64748b">How it absorbs change</text>
<text x="662" y="152" font-size="11" font-weight="700" fill="#64748b">Risk handling</text>
<text x="874" y="152" font-size="11" font-weight="700" fill="#64748b">Best-fit situation</text>

<text x="38" y="182" font-size="11.5" font-weight="700" fill="#1e3a8a">Build &amp; fix</text>
<text x="240" y="182" font-size="10.5" fill="#334155">None at all</text>
<text x="400" y="182" font-size="10.5" fill="#334155">Not absorbed &#8212; ad hoc</text>
<text x="662" y="182" font-size="10.5" fill="#334155">None</text>
<text x="874" y="182" font-size="10.5" fill="#334155">Toy programs, one programmer</text>
<rect x="30" y="194" width="1020" height="30" rx="5" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="214" font-size="11.5" font-weight="700" fill="#1e3a8a">Classical waterfall</text>
<text x="240" y="214" font-size="10.5" fill="#334155">Yes, complete</text>
<text x="400" y="214" font-size="10.5" fill="#334155">Not absorbed &#8212; no feedback path</text>
<text x="662" y="214" font-size="10.5" fill="#334155">None</text>
<text x="874" y="214" font-size="10.5" fill="#334155">Stable requirements, small project</text>
<rect x="30" y="226" width="1020" height="30" rx="5" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="246" font-size="11.5" font-weight="700" fill="#1e3a8a">Iterative waterfall</text>
<text x="240" y="246" font-size="10.5" fill="#334155">Yes, complete</text>
<text x="400" y="246" font-size="10.5" fill="#334155">Feedback between phases</text>
<text x="662" y="246" font-size="10.5" fill="#334155">Phase containment of errors</text>
<text x="874" y="246" font-size="10.5" fill="#334155">Stable requirements, medium size</text>
<rect x="30" y="258" width="1020" height="30" rx="5" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="278" font-size="11.5" font-weight="700" fill="#1e3a8a">V-model</text>
<text x="240" y="278" font-size="10.5" fill="#334155">Yes, complete</text>
<text x="400" y="278" font-size="10.5" fill="#334155">Feedback; V&amp;V planned early</text>
<text x="662" y="278" font-size="10.5" fill="#334155">Verification &amp; validation planning</text>
<text x="874" y="278" font-size="10.5" fill="#334155">Integration-risk projects</text>
<rect x="30" y="290" width="1020" height="30" rx="5" fill="#faf5ff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="310" font-size="11.5" font-weight="700" fill="#1e3a8a">Prototyping</text>
<text x="240" y="310" font-size="10.5" fill="#334155">No</text>
<text x="400" y="310" font-size="10.5" fill="#334155">Discovered by building one</text>
<text x="662" y="310" font-size="10.5" fill="#334155">Only risks identifiable up front</text>
<text x="874" y="310" font-size="10.5" fill="#334155">Unclear requirements, GUI, new tech</text>
<rect x="30" y="322" width="1020" height="30" rx="5" fill="#faf5ff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="342" font-size="11.5" font-weight="700" fill="#1e3a8a">Evolutionary</text>
<text x="240" y="342" font-size="10.5" fill="#334155">No</text>
<text x="400" y="342" font-size="10.5" fill="#334155">The system itself evolves</text>

<text x="874" y="342" font-size="10.5" fill="#334155">Long-lived products, drifting needs</text>

<text x="38" y="374" font-size="11.5" font-weight="700" fill="#1e3a8a">Incremental</text>
<text x="240" y="374" font-size="10.5" fill="#334155">Yes, then sliced</text>
<text x="400" y="374" font-size="10.5" fill="#334155">Absorbed between increments</text>
<text x="662" y="374" font-size="10.5" fill="#334155">Lower risk of total failure</text>
<text x="874" y="374" font-size="10.5" fill="#334155">Large project, requirements understood</text>
<rect x="30" y="386" width="1020" height="30" rx="5" fill="#fff7ed" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="406" font-size="11.5" font-weight="700" fill="#1e3a8a">RAD</text>
<text x="240" y="406" font-size="10.5" fill="#334155">Yes, less formal</text>
<text x="400" y="406" font-size="10.5" fill="#334155">Time-boxed; parallel teams</text>
<text x="662" y="406" font-size="10.5" fill="#334155">None &#8212; excludes high risk</text>
<text x="874" y="406" font-size="10.5" fill="#334155">Small/medium, schedule-bound</text>

<text x="38" y="438" font-size="11.5" font-weight="700" fill="#1e3a8a">Spiral</text>
<text x="240" y="438" font-size="10.5" fill="#334155">No</text>
<text x="400" y="438" font-size="10.5" fill="#334155">Absorbed at every loop</text>
<text x="662" y="438" font-size="10.5" fill="#334155">Risk is the control variable</text>
<text x="874" y="438" font-size="10.5" fill="#334155">Large-scale, high-risk</text>
<rect x="30" y="450" width="1020" height="30" rx="5" fill="#ecfeff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="470" font-size="11.5" font-weight="700" fill="#1e3a8a">Unified Process</text>
<text x="240" y="470" font-size="10.5" fill="#334155">Partly</text>
<text x="400" y="470" font-size="10.5" fill="#334155">Two-level iteration</text>
<text x="662" y="470" font-size="10.5" fill="#334155">Elaboration attacks the risks</text>
<text x="874" y="470" font-size="10.5" fill="#334155">Object-oriented, adoptable framework</text>
<rect x="30" y="482" width="1020" height="30" rx="5" fill="#ecfeff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="502" font-size="11.5" font-weight="700" fill="#1e3a8a">Agile / XP / Scrum</text>
<text x="240" y="502" font-size="10.5" fill="#334155">No &#8212; they are expected to change</text>
<text x="400" y="502" font-size="10.5" fill="#334155">Two-to-three-week increments</text>
<text x="662" y="502" font-size="10.5" fill="#334155">Fast feedback, low ceremony</text>
<text x="874" y="502" font-size="10.5" fill="#334155">Small team, fast-changing requirements</text>
<line x1="30" y1="522" x2="1050" y2="522" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="30" y="540" font-size="13.5" font-weight="700" fill="#1e3a8a" letter-spacing="1.1">THE TWO AXES &#8212; CHANGE AVOIDANCE VERSUS CHANGE TOLERANCE (SOMMERVILLE)</text>

<text x="42" y="570" font-size="11.5" font-weight="700" fill="#1e40af">Waterfall family</text>
<text x="42" y="590" font-size="10.5" fill="#334155">Change avoidance only</text>

<text x="246" y="590" font-size="10.5" fill="#334155">Change avoidance only</text>
<rect x="438" y="546" width="186" height="58" rx="9" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="450" y="570" font-size="11.5" font-weight="700" fill="#047857">Incremental / Evolutionary</text>
<text x="450" y="590" font-size="10.5" fill="#334155">Change tolerance</text>
<rect x="642" y="546" width="186" height="58" rx="9" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
<text x="654" y="570" font-size="11.5" font-weight="700" fill="#0e7490">Agile</text>
<text x="654" y="590" font-size="10.5" fill="#334155">Change tolerance</text>
<rect x="846" y="546" width="186" height="58" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="858" y="570" font-size="11.5" font-weight="700" fill="#b91c1c">Spiral</text>
<text x="858" y="590" font-size="10.5" fill="#334155">BOTH &#8212; the only one</text>
