<text x="285" y="552" text-anchor="middle" font-size="11.5" fill="#475569">&#9679;1 feasibility &#160;&#183;&#160; &#9679;2 requirements &#160;&#183;&#160; &#9679;3 design &#160;&#183;&#160; &#9679;4 implementation</text>

<g font-size="13" font-weight="600" fill="#0f172a">
  <rect x="560" y="112" width="490" height="100" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <circle cx="586" cy="140" r="12" fill="#6d28d9"/><text x="586" y="145" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1</text>
  <text x="608" y="145" font-size="13.5" font-weight="700" fill="#6d28d9">Objective setting</text>
  <text x="580" y="170" font-size="12" fill="#475569">Define this phase&#8217;s objectives and constraints; draw up a management</text>
  <text x="580" y="188" font-size="12" fill="#475569">plan; identify the project risks and possible alternative strategies.</text>

  <rect x="560" y="228" width="490" height="100" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <circle cx="586" cy="256" r="12" fill="#dc2626"/><text x="586" y="261" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2</text>
  <text x="608" y="261" font-size="13.5" font-weight="700" fill="#b91c1c">Risk assessment &amp; reduction</text>
  <text x="580" y="286" font-size="12" fill="#475569">Analyse each identified risk in detail and act to reduce it &#8212; e.g. build a</text>
  <text x="580" y="304" font-size="12" fill="#475569">prototype if the requirements themselves are the risk.</text>

  <rect x="560" y="344" width="490" height="100" rx="10" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="586" cy="372" r="12" fill="#047857"/><text x="586" y="377" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>
  <text x="608" y="377" font-size="13.5" font-weight="700" fill="#047857">Development &amp; validation</text>
  <text x="580" y="402" font-size="12" fill="#475569">Pick the development model <tspan font-weight="700">from the dominant risk</tspan> &#8212; UI &#8594; throwaway</text>
  <text x="580" y="420" font-size="12" fill="#475569">prototyping; safety &#8594; formal transformation; integration &#8594; waterfall.</text>

  <rect x="560" y="460" width="490" height="100" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <circle cx="586" cy="488" r="12" fill="#0369a1"/><text x="586" y="493" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">4</text>
  <text x="608" y="493" font-size="13.5" font-weight="700" fill="#0369a1">Planning</text>
  <text x="580" y="518" font-size="12" fill="#475569">Review the loop with the customer, decide whether to continue, and draw</text>
  <text x="580" y="536" font-size="12" fill="#475569">up the plan for the next phase.</text>
</g>
