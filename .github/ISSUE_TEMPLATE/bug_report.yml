name: Bug report
description: Report something that is not working
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, files, or quiz involved.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: e.g. Windows 11 + Python 3.12, Android 14 tablet, Chrome 120.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste logcat, pytest output, or screenshots (never secrets or keys).
